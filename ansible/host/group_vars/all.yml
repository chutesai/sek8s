---
# Shared defaults for ansible/host operational playbooks.
# Override in inventory, extra-vars, or Vault.

sek8s_remote_root: /opt/sek8s
sek8s_remote_host_tools: "{{ sek8s_remote_root }}/host-tools"

# host_tools_local is set in each play (playbook_dir -> repo root / host-tools).

# PCCS (setup playbook) — set **both** via Vault or extra-vars to run automated PCCS; omit both to skip (with notice).
# Setting only one of the two fails the play with a remediation message.
# pccs_api_key: ""
# pccs_password: ""   # used for UserTokenHash and AdminTokenHash (SHA-512)

pccs_config_path: /opt/intel/sgx-dcap-pccs/config/default.json
pccs_ssl_dir: /opt/intel/sgx-dcap-pccs/ssl_key

# Launch / upgrade: chutes_vm_config renders config.yaml on the host.
#   chutes_miner_ss58, chutes_miner_seed — required (Vault / host_vars)
#   vm.hostname defaults to inventory_hostname; set chutes_vm_hostname to override
#   Guest bridge /24 is picked to avoid overlapping host IPv4 unless chutes_guest_bridge_network is set
# Upgrade / localhost CLI: tee * --name defaults to inventory_hostname; set tee_server_name to override.
# chutes_miner_api, chutes_kubeconfig_path, upgrade_force_delete_stuck_pods — defaults in
# roles/host_tools/defaults/main.yml so inventory can override (group_vars/all would win).
chutes_validator_api: "https://api.chutes.ai"

upgrade_base_image_url: "https://vm.chutes.ai/tdx-guest.qcow2"
upgrade_staged_basename: tdx-guest-staged.qcow2
upgrade_default_base_image: /var/lib/chutes/base-images/tdx-guest.qcow2
upgrade_chute_label: "chutes/chute=true"
upgrade_drain_timeout: 600s
upgrade_powerdown_timeout_seconds: 300
upgrade_health_poll_seconds: 60
