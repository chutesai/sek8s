---
# Set to true to automatically put the server into maintenance, drain all
# chute pods, and shut down the VM before upgrading. When false (default),
# the playbook fails if a TEE guest is detected running so the operator
# must shut it down manually first to avoid score impact.
#
# Override in inventory host_vars/group_vars or with -e auto_drain_vm=true.
auto_drain_vm: false
