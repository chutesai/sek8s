---
# Pre-upgrade tasks for hosts currently on Ubuntu 25.10 (Questing).
# Handles hosts that were provisioned with the old Ubuntu2510Profile which used
# the kobuk-team tdx-attestation-release PPA (suite: oracular) for attestation.
# Hosts provisioned after that profile was migrated to Intel DCAP will not have
# any of these files — all removals are graceful.

- name: "Pre 25.10: stop tdx-qgs service if running"
  ansible.builtin.service:
    name: tdx-qgs
    state: stopped
  failed_when: false

- name: "Pre 25.10: stop sgx-dcap-pccs service if running"
  ansible.builtin.service:
    name: sgx-dcap-pccs
    state: stopped
  failed_when: false

- name: "Pre 25.10: remove kobuk attestation PPA source files"
  ansible.builtin.file:
    path: "{{ _apt_source }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/kobuk-team-ubuntu-tdx-attestation-release-oracular.sources
    - /etc/apt/sources.list.d/kobuk-team-ubuntu-tdx-attestation-release-noble.sources
    - /etc/apt/sources.list.d/kobuk-team-ubuntu-tdx-attestation-release-plucky.sources
    - /etc/apt/sources.list.d/kobuk-kobuk-team-tdx-attestation-release.sources
  loop_control:
    loop_var: _apt_source

- name: "Pre 25.10: find kobuk pin and unattended-upgrades files"
  ansible.builtin.find:
    paths:
      - /etc/apt/preferences.d
      - /etc/apt/apt.conf.d
    patterns:
      - "*kobuk*"
  register: _kobuk_files

- name: "Pre 25.10: delete kobuk pin and unattended-upgrades files"
  ansible.builtin.file:
    path: "{{ _kobuk_file.path }}"
    state: absent
  loop: "{{ _kobuk_files.files }}"
  loop_control:
    loop_var: _kobuk_file
    label: "{{ _kobuk_file.path }}"

- name: "Pre 25.10: find all installed SGX/attestation packages"
  ansible.builtin.shell:
    cmd: dpkg --list | grep -iE 'sgx|libmpa' | awk '{print $2}' || true
    executable: /bin/bash
  register: _sgx_packages
  changed_when: false

- name: "Pre 25.10: purge all SGX/attestation packages"
  ansible.builtin.apt:
    name: "{{ _sgx_packages.stdout_lines }}"
    state: absent
    purge: true
  when: _sgx_packages.stdout_lines | length > 0
  failed_when: false

- name: "Pre 25.10: autoremove orphaned dependencies"
  ansible.builtin.apt:
    autoremove: true
  failed_when: false

- name: "Pre 25.10: remove stale PCCS directory left by apt purge"
  # apt purge warns "directory not empty so not removed" and leaves the tree
  # behind. The fresh install via setup-tdx-host --noninteractive would then
  # skip npm install (directory already exists), producing a broken install
  # with no node_modules. Remove it so the reinstall starts clean.
  ansible.builtin.file:
    path: /opt/intel/sgx-dcap-pccs
    state: absent
