---
# Pre-upgrade tasks for hosts currently on Ubuntu 25.10 (Questing).
# Handles hosts that were provisioned with the old Ubuntu2510Profile which used
# the kobuk-team tdx-attestation-release PPA (suite: oracular) for attestation.
# Hosts provisioned after that profile was migrated to Intel DCAP (or already
# remediated via remediate-host.yml) will have no kobuk sources — the package
# purge and PCCS directory removal are gated on kobuk sources being present so
# correctly-installed Intel DCAP packages are not torn down unnecessarily.

- name: "Pre 25.10: stop tdx-qgs service if running"
  ansible.builtin.service:
    name: tdx-qgs
    state: stopped
  failed_when: false

- name: "Pre 25.10: stop sgx-dcap-pccs service if running"
  ansible.builtin.service:
    name: sgx-dcap-pccs
    state: stopped
  failed_when: false

# ── Detect kobuk presence (idempotent across retries) ────────────────────────
# Search all directories that can carry kobuk evidence:
#   sources.list.d   — PPA source files (removed below)
#   preferences.d    — kobuk pin files (removed below)
#   apt.conf.d       — kobuk unattended-upgrades drop-in (removed below)
#   /var/lib/apt/lists — downloaded package-index cache; filenames are derived
#                        from the source URL so kobuk cache files contain
#                        "kobuk" in the name and survive until `apt update`
#                        runs — which hop.yml does only AFTER this file
#                        completes. This means the flag stays correct even if
#                        a previous run failed after the source files were
#                        removed but before the package purge finished.

- name: "Pre 25.10: find all kobuk indicators"
  ansible.builtin.find:
    paths:
      - /etc/apt/sources.list.d
      - /etc/apt/preferences.d
      - /etc/apt/apt.conf.d
      - /var/lib/apt/lists
    patterns:
      - "*kobuk*"
    recurse: false
  register: _kobuk_indicators

- name: "Pre 25.10: set kobuk-present flag"
  ansible.builtin.set_fact:
    _kobuk_was_present: "{{ _kobuk_indicators.files | length > 0 }}"

- name: "Pre 25.10: remove kobuk attestation PPA source files"
  ansible.builtin.file:
    path: "{{ _apt_source }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/kobuk-team-ubuntu-tdx-attestation-release-oracular.sources
    - /etc/apt/sources.list.d/kobuk-team-ubuntu-tdx-attestation-release-noble.sources
    - /etc/apt/sources.list.d/kobuk-team-ubuntu-tdx-attestation-release-plucky.sources
    - /etc/apt/sources.list.d/kobuk-kobuk-team-tdx-attestation-release.sources
  loop_control:
    loop_var: _apt_source

- name: "Pre 25.10: find kobuk pin and unattended-upgrades files"
  ansible.builtin.find:
    paths:
      - /etc/apt/preferences.d
      - /etc/apt/apt.conf.d
    patterns:
      - "*kobuk*"
  register: _kobuk_files

- name: "Pre 25.10: delete kobuk pin and unattended-upgrades files"
  ansible.builtin.file:
    path: "{{ _kobuk_file.path }}"
    state: absent
  loop: "{{ _kobuk_files.files }}"
  loop_control:
    loop_var: _kobuk_file
    label: "{{ _kobuk_file.path }}"

# ── Package purge — kobuk hosts only ─────────────────────────────────────────

- name: "Pre 25.10: find all installed SGX/attestation packages"
  ansible.builtin.shell:
    cmd: dpkg --list | grep -iE 'sgx|libmpa' | awk '{print $2}' || true
    executable: /bin/bash
  register: _sgx_packages
  changed_when: false
  when: _kobuk_was_present | bool

- name: "Pre 25.10: purge all SGX/attestation packages"
  ansible.builtin.apt:
    name: "{{ _sgx_packages.stdout_lines }}"
    state: absent
    purge: true
  when:
    - _kobuk_was_present | bool
    - _sgx_packages.stdout_lines | length > 0
  failed_when: false

- name: "Pre 25.10: autoremove orphaned dependencies"
  ansible.builtin.apt:
    autoremove: true
  when: _kobuk_was_present | bool
  failed_when: false

- name: "Pre 25.10: remove stale PCCS directory left by apt purge"
  # apt purge warns "directory not empty so not removed" and leaves the tree
  # behind. The fresh install via setup-tdx-host --noninteractive would then
  # skip npm install (directory already exists), producing a broken install
  # with no node_modules. Remove it so the reinstall starts clean.
  ansible.builtin.file:
    path: /opt/intel/sgx-dcap-pccs
    state: absent
  when: _kobuk_was_present | bool
