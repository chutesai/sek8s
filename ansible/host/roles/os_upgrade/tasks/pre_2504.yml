---
# Pre-upgrade tasks for hosts currently on Ubuntu 25.04 (Plucky).
# Removes kobuk-team PPA sources and attestation packages installed by the
# old Ubuntu2504Profile (both tdx-release and tdx-attestation-release PPAs).
# All removals are idempotent — missing files and uninstalled packages are
# handled gracefully.

- name: "Pre 25.04: stop tdx-qgs service if running"
  ansible.builtin.service:
    name: tdx-qgs
    state: stopped
  failed_when: false

- name: "Pre 25.04: stop sgx-dcap-pccs service if running"
  ansible.builtin.service:
    name: sgx-dcap-pccs
    state: stopped
  failed_when: false

- name: "Pre 25.04: find all kobuk-related apt files"
  ansible.builtin.find:
    paths:
      - /etc/apt/sources.list.d
      - /etc/apt/preferences.d
      - /etc/apt/apt.conf.d
      - /etc/apt/keyrings
    patterns:
      - "*kobuk*"
  register: _kobuk_files

- name: "Pre 25.04: delete all kobuk apt files including any .save/.distUpgrade backups"
  ansible.builtin.file:
    path: "{{ _kobuk_file.path }}"
    state: absent
  loop: "{{ _kobuk_files.files }}"
  loop_control:
    loop_var: _kobuk_file
    label: "{{ _kobuk_file.path }}"

- name: "Pre 25.04: purge kobuk-sourced attestation packages"
  ansible.builtin.apt:
    name:
      - tdx-qgs
      - sgx-dcap-pccs
      - libsgx-dcap-default-qpl
      - sgx-ra-service
      - sgx-pck-id-retrieval-tool
    state: absent
    purge: true
  failed_when: false

# ── Remove grub-pc on EFI systems before upgrade ─────────────────────────────
# On EFI systems whose root is on LVM, grub-pc's post-install script fails
# because it tries to run grub-install for i386-pc and cannot find a BIOS
# drive for /dev/mapper/vg0-lv--. do-release-upgrade unpacks the new grub-pc
# package but leaves it half-configured. After rebooting into 25.10, the next
# apt run (e.g. host_prerequisites installing aria2) triggers dpkg to finish
# configuring the pending packages — grub-pc fails again, blocking all further
# apt/dpkg calls with "sub-process dpkg returned an error code (1)".
#
# Purging grub-pc before the upgrade means do-release-upgrade never unpacks it.
# grub-efi-amd64 owns the bootloader on these hosts; grub-pc should not be
# present. DEBIAN_FRONTEND=noninteractive suppresses the debconf prompt asking
# whether to remove all GRUB 2 files from /boot/grub (answer: no — that
# directory is still needed by grub-efi-amd64).

- name: "Pre 25.04: check if system booted via EFI"
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: _efi_present

- name: "Pre 25.04: ensure grub-efi-amd64 and grub-common are installed before removing grub-pc"
  ansible.builtin.apt:
    name:
      - grub-common
      - grub-efi-amd64
    state: present
  when: _efi_present.stat.exists
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: "Pre 25.04: purge grub-pc on EFI systems before upgrade"
  ansible.builtin.apt:
    name:
      - grub-pc
      - grub-pc-bin
    state: absent
    purge: true
  when: _efi_present.stat.exists
  environment:
    DEBIAN_FRONTEND: noninteractive

# ── Ensure systemd-networkd is persistently enabled ─────────────────────────
# On 25.04 cloud images, systemd-networkd is typically enabled only via
# netplan's runtime generator (/run/systemd/), not by persistent symlinks in
# /etc/systemd/system/. netplan 1.x (25.10) no longer generates these runtime
# enable symlinks, so after the upgrade networkd never starts, wait-online
# hangs, and cloud-init blocks forever.
#
# Additionally, 25.04 images mask systemd-networkd-wait-online.service (symlink
# to /dev/null) because cloud-init historically managed network setup itself.
# cloud-init 25.3 (25.10+) now calls `systemctl start
# systemd-networkd-wait-online.service` with allowed_return_codes=[0], so a
# masked service aborts the network stage and the host is unreachable.
#
# Fix both: remove the mask and create persistent enable symlinks that survive
# the package replacement during do-release-upgrade.

- name: "Pre 25.04: unmask systemd-networkd-wait-online"
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-networkd-wait-online.service
    state: absent

- name: "Pre 25.04: ensure networkd enable directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/systemd/system/multi-user.target.wants
    - /etc/systemd/system/sockets.target.wants
    - /etc/systemd/system/network-online.target.wants

- name: "Pre 25.04: persistently enable systemd-networkd stack"
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: /lib/systemd/system/systemd-networkd.service
      dest: /etc/systemd/system/multi-user.target.wants/systemd-networkd.service
    - src: /lib/systemd/system/systemd-networkd.socket
      dest: /etc/systemd/system/sockets.target.wants/systemd-networkd.socket
    - src: /lib/systemd/system/systemd-networkd-wait-online.service
      dest: /etc/systemd/system/network-online.target.wants/systemd-networkd-wait-online.service
    - src: /lib/systemd/system/networkd-dispatcher.service
      dest: /etc/systemd/system/multi-user.target.wants/networkd-dispatcher.service

# ── Break dkms ↔ cloud-init boot deadlock ─────────────────────────────────────
# dkms.service ships with Before=network-pre.target (so DKMS-built NIC drivers
# load before networking starts) and DefaultDependencies=yes which adds
# After=sysinit.target.  On 25.04 this was fine because cloud-init's network
# stage didn't order itself before sysinit.target.
#
# cloud-init 25.3 (25.10) redesigned its services: cloud-init-network.service
# now sets Before=sysinit.target, and internally runs
#   systemctl start systemd-networkd-wait-online.service
# wait-online BindsTo= networkd, networkd has After=network-pre.target, and
# network-pre.target pulls in dkms via dkms's Before=.  The result:
#
#   cloud-init-network → (Before) sysinit.target → (After) dkms →
#   (Before) network-pre.target → (After) networkd → wait-online →
#   cloud-init-network   ← deadlock
#
# This affects ALL 25.04→25.10 upgrades on hosts with DKMS installed (i.e. every
# GPU server with NVIDIA driver DKMS packages).  Fresh 25.10 installs dodge it
# because cloud-init's first-boot codepath is different.
#
# Fix: full unit override that removes Before=network-pre.target.  A drop-in
# with Before= (empty reset) does NOT work — systemd drop-in fragments cannot
# reset list values inherited from the base unit file.  DKMS modules still
# build normally, they just no longer block networking startup.

- name: "Pre 25.04: check if dkms.service exists"
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/dkms.service
  register: _dkms_unit

- name: "Pre 25.04: copy dkms.service to /etc override location"
  ansible.builtin.copy:
    src: /usr/lib/systemd/system/dkms.service
    dest: /etc/systemd/system/dkms.service
    remote_src: true
    mode: '0644'
  when: _dkms_unit.stat.exists

- name: "Pre 25.04: remove network-pre.target from dkms Before="
  ansible.builtin.replace:
    path: /etc/systemd/system/dkms.service
    regexp: 'Before=network-pre\.target\s*'
    replace: 'Before='
  when: _dkms_unit.stat.exists

# ── Pin netplan interface names across naming-scheme change ──────────────────
# Ubuntu 25.04 used netplan 0.x which generated udev rename rules so that the
# interface KEY name in the YAML (e.g. enp157s0f1np1) was enforced at boot even
# when the kernel's own predictable name differed. netplan 1.x (shipped in
# 25.10) dropped this implicit renaming: without an explicit set-name: the key
# is a logical label only, and the interface keeps whatever name systemd-udevd
# assigns under its v257 naming scheme (e.g. ens31f1np1).
#
# systemd-networkd matches by PermanentMACAddress so the IP is applied
# correctly regardless of name — but networkd-wait-online is told to wait for
# the interface BY NAME (generated by the netplan systemd generator from the
# YAML key). If the name doesn't match the live interface, wait-online hangs
# forever and cloud-init never proceeds.
#
# Fix: for every ethernet interface that uses match.macaddress without an
# explicit set-name, inject set-name equal to the YAML key. This generates a
# systemd .link file so udevd renames the interface to the canonical name
# before networkd configures it, restoring the 0.x behaviour in 1.x.

- name: "Pre 25.04: pin netplan interface names with set-name (netplan 0.x → 1.x compat)"
  ansible.builtin.shell:
    cmd: /usr/bin/python3 /dev/stdin
    stdin: |
      import sys, yaml, pathlib

      path = pathlib.Path("/etc/netplan/50-cloud-init.yaml")
      if not path.exists():
          print("no netplan file found, skipping")
          sys.exit(0)

      cfg = yaml.safe_load(path.read_text())
      changed = False

      for section in ("ethernets",):
          for name, iface in (cfg.get("network", {}).get(section, {}) or {}).items():
              if not isinstance(iface, dict):
                  continue
              if "match" in iface and "set-name" not in iface:
                  iface["set-name"] = name
                  changed = True
                  print(f"added set-name: {name}")

      if changed:
          path.write_text(yaml.dump(cfg, default_flow_style=False, allow_unicode=True))
      else:
          print("no changes needed")
  register: _netplan_setname
  changed_when: "'added set-name' in _netplan_setname.stdout"
