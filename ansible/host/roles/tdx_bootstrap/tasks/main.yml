---
- name: Run setup-tdx-host (idempotent — installs packages, kernel, PPAs, tools)
  ansible.builtin.command:
    argv:
      - "{{ sek8s_remote_host_tools }}/scripts/setup-tdx-host"
  register: setup_tdx
  changed_when: setup_tdx.rc == 0

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot host and wait
  ansible.builtin.reboot:
    reboot_timeout: 900
  when: reboot_required.stat.exists

- name: Re-check dmesg for TDX after reboot
  ansible.builtin.shell: dmesg | grep -i tdx || true
  args:
    executable: /bin/bash
  register: tdx_after_reboot
  changed_when: false
  when: reboot_required.stat.exists

- name: Capture dmesg for TDX check
  ansible.builtin.shell: dmesg | grep -i tdx || true
  args:
    executable: /bin/bash
  register: tdx_dmesg_current
  changed_when: false
  when: not reboot_required.stat.exists

- name: Merge TDX dmesg fact after reboot
  ansible.builtin.set_fact:
    tdx_final_dmesg: "{{ tdx_after_reboot.stdout }}"
  when: reboot_required.stat.exists

- name: Use current dmesg when no reboot
  ansible.builtin.set_fact:
    tdx_final_dmesg: "{{ tdx_dmesg_current.stdout }}"
  when: not reboot_required.stat.exists

- name: Fail if TDX not initialized
  ansible.builtin.fail:
    msg: >-
      TDX does not appear initialized (neither 'tdx: TDX module initialized' nor
      'virt/tdx: module initialized' found in dmesg). See host-tools/README.md.
  when:
    - "'tdx: TDX module initialized' not in tdx_final_dmesg"
    - "'virt/tdx: module initialized' not in tdx_final_dmesg"
