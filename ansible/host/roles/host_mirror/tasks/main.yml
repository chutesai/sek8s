---
- name: Benchmark Ubuntu mirrors and select fastest
  ansible.builtin.shell: |
    best_mirror="archive.ubuntu.com"
    best_speed=0
    release="{{ ansible_facts['distribution_release'] }}"
    for mirror in \
        au.archive.ubuntu.com \
        nz.archive.ubuntu.com \
        us.archive.ubuntu.com \
        de.archive.ubuntu.com \
        gb.archive.ubuntu.com \
        archive.ubuntu.com; do
      speed=$(curl -o /dev/null -s --connect-timeout 3 --max-time 8 \
        -w "%{speed_download}" \
        "http://${mirror}/ubuntu/dists/${release}/Release" 2>/dev/null \
        | awk '{print int($1)}')
      speed=${speed:-0}
      if [ "$speed" -gt "$best_speed" ]; then
        best_speed="$speed"
        best_mirror="$mirror"
      fi
    done
    echo "${best_mirror}"
  register: fastest_mirror
  changed_when: false

- name: Log selected mirror
  ansible.builtin.debug:
    msg: "Fastest apt mirror for this host: {{ fastest_mirror.stdout | trim }}"

- name: Update ubuntu.sources to use fastest mirror
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/ubuntu.sources
    regexp: 'http://archive\.ubuntu\.com/ubuntu'
    replace: "http://{{ fastest_mirror.stdout | trim }}/ubuntu"
  when: fastest_mirror.stdout | trim != 'archive.ubuntu.com'
  failed_when: false
  notify: Refresh apt cache

- name: Update legacy sources.list if present
  ansible.builtin.replace:
    path: /etc/apt/sources.list
    regexp: 'http://archive\.ubuntu\.com/ubuntu'
    replace: "http://{{ fastest_mirror.stdout | trim }}/ubuntu"
  when: fastest_mirror.stdout | trim != 'archive.ubuntu.com'
  failed_when: false
  notify: Refresh apt cache
