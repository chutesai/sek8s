---
# Install and configure chrony for reliable NTP synchronization on TDX hosts.
#
# Ubuntu's default systemd-timesyncd only slews (gradually adjusts) the clock
# for offsets under ~1000 seconds. On some hardware (e.g. B200) the BMC RTC
# can be set minutes ahead; timesyncd would take a long time to correct this
# and the host would launch VMs with a skewed clock. VMs inherit the host clock
# at launch time (QEMU RTC), and any boot-time mTLS certs generated before NTP
# starts in the guest will carry the wrong notBefore timestamp.
#
# chrony with makestep steps the clock immediately if the offset exceeds
# the configured threshold, correcting a wrong RTC on first boot.

- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: false

- name: Stop and mask systemd-timesyncd (replaced by chrony)
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: false
    masked: true
  failed_when: false

- name: Configure chrony
  ansible.builtin.copy:
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # NTP sources
      pool ntp.ubuntu.com iburst
      pool 0.ubuntu.pool.ntp.org iburst
      pool 1.ubuntu.pool.ntp.org iburst

      keyfile /etc/chrony/chrony.keys
      driftfile /var/lib/chrony/chrony.drift
      logdir /var/log/chrony

      # Step the clock (rather than slew) if the offset exceeds 1 second
      # during any clock update. This ensures the clock is corrected immediately
      # on first boot even when the BMC RTC is set minutes ahead.
      makestep 1 -1

      # Keep the hardware clock in sync with the system clock.
      rtcsync
  notify: restart chrony

- name: Enable and start chronyd
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
    daemon_reload: true

- name: Force immediate clock step
  ansible.builtin.command: chronyc makestep
  changed_when: true

- name: Wait for chrony to synchronize clock (up to 60 seconds)
  ansible.builtin.command: chronyc waitsync 60 1 0 1
  register: chrony_waitsync
  changed_when: false
  failed_when: chrony_waitsync.rc != 0

- name: Show final clock tracking info
  ansible.builtin.command: chronyc tracking
  register: chrony_tracking
  changed_when: false

- name: Display clock sync status
  ansible.builtin.debug:
    msg: "{{ chrony_tracking.stdout_lines }}"
