---
# Non-interactive PCCS: template default.json, TLS material, restart service, run PCKIDRetrievalTool.
# Requires both pccs_api_key and pccs_password when automated PCCS runs; omit both to skip (with notice).

- name: Check if PCCS package files are present
  ansible.builtin.stat:
    path: /opt/intel/sgx-dcap-pccs/package.json
  register: pccs_package_json

- name: Purge and reinstall PCCS when package files are missing
  # Only needed when the package itself is absent/corrupt, not for missing
  # node_modules — that case is handled by the explicit npm install below.
  when: not pccs_package_json.stat.exists
  block:
    - name: Purge broken sgx-dcap-pccs installation
      ansible.builtin.apt:
        name: sgx-dcap-pccs
        state: absent
        purge: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Remove stale PCCS directory left by apt purge
      # apt purge warns "directory not empty so not removed" and leaves the
      # tree behind; remove it so the reinstall starts with a clean slate.
      ansible.builtin.file:
        path: /opt/intel/sgx-dcap-pccs
        state: absent

    - name: Reinstall sgx-dcap-pccs
      ansible.builtin.apt:
        name: sgx-dcap-pccs
        state: present
        update_cache: false
      environment:
        DEBIAN_FRONTEND: noninteractive

- name: Check if PCCS node_modules are intact
  ansible.builtin.stat:
    path: /opt/intel/sgx-dcap-pccs/node_modules/config
  register: pccs_node_modules

- name: Populate PCCS node_modules
  # The sgx-dcap-pccs Debian post-install only runs `npm install` during
  # interactive debconf prompts. Non-interactive installs (DEBIAN_FRONTEND=
  # noninteractive) skip it entirely, leaving node_modules absent and the
  # service unable to start. Run it explicitly whenever it is missing.
  ansible.builtin.command:
    cmd: npm install --prefer-offline
    chdir: /opt/intel/sgx-dcap-pccs
  when: not pccs_node_modules.stat.exists
  changed_when: true

- name: Detect whether PCCS secrets are present
  ansible.builtin.set_fact:
    pccs_key_present: "{{ pccs_api_key is defined and (pccs_api_key | string | length > 0) }}"
    pccs_pass_present: "{{ pccs_password is defined and (pccs_password | string | length > 0) }}"

- name: Fail when PCCS credentials are only partially set
  ansible.builtin.fail:
    msg: >-
      Incomplete PCCS configuration: you must set **both** pccs_api_key and pccs_password
      (Vault, host_vars, or group_vars on your inventory host), or omit **both** to skip automated PCCS.
      Partial settings leave the host in an ambiguous state. See ansible/host/roles/pccs_configure
      and host-tools/README.md Step 2 for manual PCCS if you are not using automation.
  when: (pccs_key_present | bool) != (pccs_pass_present | bool)

- name: Operator notice — automated PCCS not running
  ansible.builtin.debug:
    msg: >-
      Automated PCCS is not running because pccs_api_key and pccs_password are not both set.
      To enable: define both variables (use ansible-vault for secrets). If you configure PCCS
      manually instead, follow host-tools/README.md Step 2; this role will make no changes.
  when: not (pccs_key_present | bool and pccs_pass_present | bool)

- name: Configure PCCS (requires both pccs_api_key and pccs_password)
  when: pccs_key_present | bool and pccs_pass_present | bool
  block:
    - name: Compute PCCS user/admin token SHA-512 hashes
      ansible.builtin.shell: |
        set -euo pipefail
        printf '%s' '{{ pccs_password }}' | openssl dgst -sha512 | awk '{print $2}'
      args:
        executable: /bin/bash
      register: pccs_hash_out
      no_log: true
      changed_when: false

    - name: Set hash facts for template
      ansible.builtin.set_fact:
        pccs_user_token_hash: "{{ pccs_hash_out.stdout | trim }}"
        pccs_admin_token_hash: "{{ pccs_hash_out.stdout | trim }}"

    - name: Ensure PCCS config directory exists
      ansible.builtin.file:
        path: "{{ pccs_config_path | dirname }}"
        state: directory
        mode: "0755"

    - name: Ensure PCCS ssl_key directory exists
      ansible.builtin.file:
        path: "{{ pccs_ssl_dir }}"
        state: directory
        mode: "0755"

    - name: Generate PCCS TLS private key
      ansible.builtin.command:
        argv:
          - openssl
          - genrsa
          - "-out"
          - "{{ pccs_ssl_dir }}/private.pem"
          - "3072"
        creates: "{{ pccs_ssl_dir }}/private.pem"

    - name: Generate self-signed PCCS certificate
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -new
          - -x509
          - -key
          - "{{ pccs_ssl_dir }}/private.pem"
          - -out
          - "{{ pccs_ssl_dir }}/file.crt"
          - -days
          - "3650"
          - -subj
          - /CN=localhost
        creates: "{{ pccs_ssl_dir }}/file.crt"

    - name: Secure private key permissions
      ansible.builtin.file:
        path: "{{ pccs_ssl_dir }}/private.pem"
        mode: "0600"
        state: file

    - name: Install PCCS default.json
      ansible.builtin.template:
        src: pccs_default.json.j2
        dest: "{{ pccs_config_path }}"
        mode: "0644"
      notify: Restart pccs

    - name: Flush handlers so PCCS restarts before PCK tool
      ansible.builtin.meta: flush_handlers

    - name: Ensure PCCS service is enabled and running
      ansible.builtin.systemd:
        name: pccs
        state: started
        enabled: true

    - name: Register platform with PCKIDRetrievalTool
      ansible.builtin.shell: |
        printf '%s\n' '{{ pccs_password }}' | sudo -E PCKIDRetrievalTool \
          -url https://localhost:8081 \
          -use_secure_cert false
      args:
        executable: /bin/bash
      register: pck_tool
      no_log: true
      failed_when: false

    - name: Fail with manual remediation when PCK tool reports an error
      ansible.builtin.fail:
        msg: >-
          PCKIDRetrievalTool did not succeed. stdout: {{ pck_tool.stdout | default('') }}.
          Common causes: wrong pccs_password, PCCS not reachable, or service not yet started.
          Complete host-tools/README.md Step 2 manually if needed.
      when: "'the data has been sent to cache server successfully' not in (pck_tool.stdout | default(''))"
