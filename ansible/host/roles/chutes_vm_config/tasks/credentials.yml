---
# Miner credentials for config.yaml: the ss58 plus exactly one key. Current Bittensor hotkey files
# carry the 64-byte sr25519 privateKey (some have no secretSeed), so the private key is taken when
# the file has one and the seed only otherwise. Explicit chutes_miner_ss58 plus
# chutes_miner_private_key or chutes_miner_seed (host_vars / Vault) skip the hotkey file.

- name: Parse miner credentials from hotkey file
  when:
    - chutes_hotkey_path is defined
    - chutes_hotkey_path | length > 0
    - >-
      chutes_miner_ss58 is not defined
      or (chutes_miner_private_key is not defined and chutes_miner_seed is not defined)
  block:
    - name: Read hotkey JSON from controller
      ansible.builtin.slurp:
        src: "{{ chutes_hotkey_path }}"
      delegate_to: localhost
      become: false
      register: _hotkey_raw
      no_log: true

    - name: Extract ss58 and the hotkey's key
      vars:
        _hotkey: "{{ _hotkey_raw.content | b64decode | from_json }}"
        _private_key: "{{ _hotkey.privateKey | default('') | regex_replace('^0x', '') }}"
      ansible.builtin.set_fact:
        chutes_miner_ss58: "{{ _hotkey.ss58Address | default('') }}"
        chutes_miner_private_key: "{{ _private_key }}"
        chutes_miner_seed: >-
          {{ '' if _private_key else (_hotkey.secretSeed | default('') | regex_replace('^0x', '')) }}
      no_log: true

- name: Validate miner credentials are present
  ansible.builtin.assert:
    that:
      - chutes_miner_ss58 | default('') | string | length > 0
      - >-
        (chutes_miner_private_key | default('') | string | length > 0)
        != (chutes_miner_seed | default('') | string | length > 0)
    fail_msg: >-
      Miner credentials are missing or ambiguous. Either set chutes_hotkey_path (path on the
      controller to the Bittensor hotkey JSON, which must contain ss58Address and privateKey or
      secretSeed) or set chutes_miner_ss58 plus exactly one of chutes_miner_private_key or
      chutes_miner_seed explicitly (host_vars / Vault).
