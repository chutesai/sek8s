---
# Graceful shutdown: chutes-miner on controller, then wait for guest serial log on metal.
# Expects: chutes_tee_server_name, chutes_hotkey_path, chutes_miner_api, upgrade_powerdown_timeout_seconds

- name: Request graceful VM shutdown via chutes-miner
  ansible.builtin.command:
    argv:
      - chutes-miner
      - tee
      - shutdown
      - --name
      - "{{ chutes_tee_server_name }}"
      - --confirm
      - --hotkey
      - "{{ chutes_hotkey_path }}"
      - --miner-api
      - "{{ chutes_miner_api }}"
  delegate_to: localhost
  become: false

# Deliberately NOT is_live_chutes_td.sh. That answers "is a guest serving?", and a QEMU that
# powered its guest off but is still reclaiming the TD's private memory answers no -- while
# still holding the image's write lock for as long as it runs. Waiting on that answer declared
# the guest gone and marched into the qcow2 lock collision the comment below warns about.
# `host devices-free` answers the question that matters here: has QEMU let go?
- name: Wait for the QEMU guest process to let go of its devices and image
  ansible.builtin.command:
    argv:
      - chutes-cvm
      - host
      - devices-free
  register: power_wait
  # rc == 0 means nothing holds them any more — that is our success condition.
  failed_when: false
  changed_when: false
  until: power_wait.rc == 0
  retries: "{{ (upgrade_powerdown_timeout_seconds | int) // 5 }}"
  delay: 5

# If the guest is still alive after the graceful power-down window, escalate.
# Proceeding now would march straight into a qcow2 write-lock collision when the
# relaunch refreshes the config volume (qemu-nbd cannot lock an image a live
# QEMU still holds). SIGTERM -> SIGKILL the chutes-td QEMU and re-check.
- name: Force-stop guest if it did not power down gracefully
  ansible.builtin.command:
    argv:
      - chutes-cvm
      - guest
      - stop
      - --force
  register: _force_stop
  failed_when: false
  changed_when: power_wait.rc != 0
  when: power_wait.rc != 0

# A guest that survives SIGKILL is in uninterruptible (D) state and will keep
# the image lock until reboot. Fail loudly with that instruction instead of
# letting the relaunch fail later with a cryptic "Failed to get write lock".
- name: Fail when guest could not be stopped (host reboot required)
  ansible.builtin.fail:
    msg: >-
      The chutes-td guest did not let go of its devices and image, and could not be
      force-stopped. Read the details below before rebooting: a QEMU still reclaiming
      the previous TD's memory clears on its own (and a plain `reboot` would hang on the
      blocked unbinds), whereas one stuck in uninterruptible D-state needs a SysRq reset.
      Either way its qcow2 lock blocks a relaunch until it is gone.
      Details: {{ (_force_stop.stdout | default('')) ~ ' ' ~ (_force_stop.stderr | default('')) }}
  when:
    - power_wait.rc != 0
    - _force_stop.rc | default(0) != 0
