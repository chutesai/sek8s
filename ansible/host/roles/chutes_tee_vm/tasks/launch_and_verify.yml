---
# Render config, start the VM via quick-launch.sh, and wait for node-health.
# Used by upgrade-guest.yml and upgrade-host.yml after the guest has been shut down.
#
# Expects (from caller scope or vars):
#   chutes_tee_server_name        — TEE server name registered with chutes-miner
#   chutes_hotkey_path            — controller path to Bittensor hotkey JSON
#   chutes_miner_api              — miner API URL
#   chutes_config_remote_path     — path to config.yaml on the remote host
#   sek8s_remote_host_tools       — path to host-tools checkout on the remote host
#   upgrade_health_poll_seconds   — seconds to poll node-health before giving up

- name: Render config.yaml on host before launch
  ansible.builtin.include_role:
    name: chutes_vm_config

- name: Check if base image exists
  ansible.builtin.stat:
    path: "{{ upgrade_default_base_image }}"
    get_checksum: false
  register: _base_img_stat

- name: Download base image when missing
  ansible.builtin.shell: |
    set -euo pipefail
    ./quick-launch.sh --download 2>&1 | tee /tmp/chutes-download.log
    exit ${PIPESTATUS[0]}
  args:
    chdir: "{{ sek8s_remote_host_tools }}/scripts"
    executable: /bin/bash
  when: not _base_img_stat.stat.exists
  changed_when: true

# ── Image integrity pre-flight ───────────────────────────────────────────────
# Validate the base image SHA256 against what quick-launch.sh expects before
# attempting to start the VM. Failing here gives a clear actionable message;
# failing inside quick-launch.sh produces a cryptic checksum error with no
# remediation hint.

- name: Read expected base image SHA256 from quick-launch.sh
  ansible.builtin.shell: |
    grep -E '^EXPECTED_BASE_SHA256=' "{{ sek8s_remote_host_tools }}/scripts/quick-launch.sh" \
      | head -1 | cut -d= -f2 | tr -d '"' | tr -d "'"
  args:
    executable: /bin/bash
  register: _launch_expected_sha
  changed_when: false

- name: Compute SHA256 of current base image
  ansible.builtin.command:
    argv:
      - sha256sum
      - "{{ upgrade_default_base_image }}"
  register: _launch_actual_sha
  changed_when: false
  # Skip when the caller already verified this image (e.g. upgrade-guest.yml just
  # promoted a freshly checksummed staged image). Nothing touched the file between
  # verification and launch, so recomputing is pure waste (~111s on a large qcow2).
  when: (_prevalidated_base_sha | default('')) != (_launch_expected_sha.stdout | trim)

- name: Use pre-validated SHA when available
  ansible.builtin.set_fact:
    _launch_actual_sha: "{{ _launch_actual_sha | combine({'stdout': (_prevalidated_base_sha | default('')) + '  ' + upgrade_default_base_image}) }}"
  when: (_prevalidated_base_sha | default('')) == (_launch_expected_sha.stdout | trim)

- name: Fail with clear message when base image SHA does not match
  ansible.builtin.fail:
    msg: >-
      Base image checksum mismatch — cannot launch safely.
      Expected: {{ _launch_expected_sha.stdout | trim }}.
      Actual:   {{ _launch_actual_sha.stdout.split()[0] }}.
      Run upgrade-guest.yml to download and promote the correct image before launching.
  when: _launch_actual_sha.stdout.split()[0] != (_launch_expected_sha.stdout | trim)

# ── PCI passthrough wedge guard ──────────────────────────────────────────────
# GPU passthrough hosts occasionally wedge the PCI subsystem: a vfio-pci unbind
# or nvidia-gpu-tools task gets stuck in uninterruptible D-state, after which any
# SBR/CC-mode op (and therefore VM launch) fails with "SBR cannot run until the
# host is rebooted". Only a reboot clears it. We detect this up front, and again
# if the launch itself wedges the host, rebooting and waiting for SSH to return
# before (re)trying the launch. chutes.guest.vfio.pci_operations_wedged() is the
# same predicate run-td uses internally (scans ps for D-state vfio/gpu-tools).

- name: Pre-flight — detect a wedged PCI subsystem
  ansible.builtin.command:
    chdir: "{{ sek8s_remote_host_tools }}/scripts"
    argv:
      - python3
      - -c
      - "import sys; from chutes.guest.vfio import pci_operations_wedged; sys.exit(0 if pci_operations_wedged() else 1)"
  register: _pci_wedged
  failed_when: false
  changed_when: false

- name: Reboot host to clear wedged PCI subsystem (pre-flight)
  ansible.builtin.reboot:
    reboot_timeout: "{{ upgrade_reboot_timeout_seconds | default(1800) }}"
    msg: "Rebooting to clear wedged GPU/PCI passthrough state before VM launch"
  when: _pci_wedged.rc == 0

- name: Launch VM (reboot and retry once if the launch wedges the PCI subsystem)
  block:
    - name: Launch VM via quick-launch.sh
      ansible.builtin.command:
        chdir: "{{ sek8s_remote_host_tools }}/scripts"
        argv:
          - ./quick-launch.sh
          - "{{ chutes_config_remote_path }}"
      register: _qlaunch
      changed_when: true
  rescue:
    # Authoritative signal: the D-state tasks that wedge the PCI subsystem persist
    # until reboot, so re-running the predicate after the failure tells us directly
    # whether a reboot would help. Fall back to matching run-td's error text.
    - name: Re-check PCI wedge state after launch failure
      ansible.builtin.command:
        chdir: "{{ sek8s_remote_host_tools }}/scripts"
        argv:
          - python3
          - -c
          - "import sys; from chutes.guest.vfio import pci_operations_wedged; sys.exit(0 if pci_operations_wedged() else 1)"
      register: _post_wedge
      failed_when: false
      changed_when: false

    - name: Classify launch failure (recoverable PCI wedge vs. other)
      ansible.builtin.set_fact:
        _launch_pci_wedged: >-
          {{ (_post_wedge.rc == 0) or
             ('wedged' in (_qlaunch.stderr | default(''))) or
             ('SBR cannot run' in (_qlaunch.stderr | default(''))) or
             ('may need host reboot' in (_qlaunch.stdout | default(''))) }}

    - name: Fail when the launch error is not a recoverable PCI wedge
      ansible.builtin.fail:
        msg: >-
          quick-launch.sh failed (rc={{ _qlaunch.rc | default('?') }}) for a reason
          other than a PCI wedge — not retrying. stderr={{ _qlaunch.stderr | default('') }}
      when: not (_launch_pci_wedged | bool)

    - name: Reboot host to clear wedged PCI subsystem (post-launch)
      ansible.builtin.reboot:
        reboot_timeout: "{{ upgrade_reboot_timeout_seconds | default(1800) }}"
        msg: "Rebooting to clear wedged GPU/PCI passthrough state after failed VM launch"

    - name: Retry VM launch after reboot
      ansible.builtin.command:
        chdir: "{{ sek8s_remote_host_tools }}/scripts"
        argv:
          - ./quick-launch.sh
          - "{{ chutes_config_remote_path }}"
      register: _qlaunch_retry
      changed_when: true
      failed_when: false

    - name: Fail if launch still fails after reboot
      ansible.builtin.fail:
        msg: >-
          quick-launch.sh still failing after a reboot to clear the PCI wedge
          (rc={{ _qlaunch_retry.rc }}). stderr={{ _qlaunch_retry.stderr | default('') }}
      when: _qlaunch_retry.rc != 0

- name: Poll node health until VM is registered and healthy
  ansible.builtin.command:
    argv:
      - chutes-miner
      - tee
      - node-health
      - --name
      - "{{ chutes_tee_server_name }}"
      - --hotkey
      - "{{ chutes_hotkey_path }}"
      - --miner-api
      - "{{ chutes_miner_api }}"
  delegate_to: localhost
  become: false
  register: _health_poll
  until: _health_poll.rc == 0
  retries: "{{ [((upgrade_health_poll_seconds | int) // 30), 1] | max }}"
  delay: 30

- name: Unlock server to resume gepetto scheduling
  ansible.builtin.command:
    argv:
      - chutes-miner
      - unlock
      - --name
      - "{{ chutes_tee_server_name }}"
      - --hotkey
      - "{{ chutes_hotkey_path }}"
      - --miner-api
      - "{{ chutes_miner_api }}"
  delegate_to: localhost
  become: false
