---
# Render config, start the VM via `chutes-cvm guest launch`, and wait for node-health.
# Used by upgrade-guest.yml and upgrade-host.yml after the guest has been shut down.
#
# Expects (from caller scope or vars):
#   chutes_tee_server_name        — TEE server name registered with chutes-miner
#   chutes_hotkey_path            — controller path to Bittensor hotkey JSON
#   chutes_miner_api              — miner API URL
#   chutes_config_remote_path     — path to config.yaml on the remote host
#   upgrade_health_poll_seconds   — seconds to poll node-health before giving up

- name: Render config.yaml on host before launch
  ansible.builtin.include_role:
    name: chutes_vm_config

# ── Image-set pre-flight ─────────────────────────────────────────────────────
# Launch is decoupled from download: the image set must already be staged (by
# upgrade-guest.yml, or `chutes-cvm image download`). We do NOT auto-download here — a
# missing set is an explicit failure with a remediation hint, not a silent fetch.
# When present, verify it is coherent against its manifest (chutes_cvm.guest.image_set
# resolve — presence/size, cheap, the bytes were fully hashed when staged) so a stale or
# out-of-sync set fails here with a clear message rather than cryptically inside chutes-cvm guest launch.

- name: Check the base image set exists
  ansible.builtin.stat:
    path: "{{ upgrade_default_base_image }}"
    get_checksum: false
  register: _base_img_stat

- name: Fail clearly when the base image set is missing
  ansible.builtin.fail:
    msg: >-
      Base image set not found at {{ upgrade_default_base_image }}. Launch does not
      auto-download — stage it first with `upgrade-guest.yml` or
      `chutes-cvm image download` (populates the set + manifest), then relaunch.
  when: not (_base_img_stat.stat.exists and _base_img_stat.stat.isdir)

- name: Verify the base image set against its manifest
  ansible.builtin.command:
    argv:
      - chutes-cvm
      - image
      - verify
      - "{{ upgrade_default_base_image }}"
  register: _image_set_resolve
  changed_when: false
  failed_when: _image_set_resolve.rc != 0

# ── Launch ───────────────────────────────────────────────────────────────────
# No pre-flight probe: `chutes-cvm guest launch` checks for itself whether anything still holds
# the passthrough devices (guest.vm.device_blockers) and refuses with the reason, the ETA when a
# previous TD is still reclaiming its memory, and the SysRq sequence. Probing first only gave a
# second, worse-informed copy of that answer -- and the old probe reacted by rebooting, which
# throws away a reclaim that would have finished on its own.
#
# A failed launch therefore stops the play with whatever the launch said. Rebooting instead is
# opt-in, because whether to spend a reboot or wait is the operator's call, not ours.

- name: Launch VM
  block:
    - name: Launch VM via chutes-cvm guest launch
      ansible.builtin.command:
        argv:
          - chutes-cvm
          - guest
          - launch
          - "{{ chutes_config_remote_path }}"
      register: _qlaunch
      changed_when: true
  rescue:
    - name: Report why the launch was refused
      ansible.builtin.debug:
        msg: >-
          chutes-cvm guest launch failed (rc={{ _qlaunch.rc | default('?') }}).
          {{ _qlaunch.stderr | default('') }}

    - name: Fail — launch refused, and no forced reboot authorised
      ansible.builtin.fail:
        msg: >-
          chutes-cvm guest launch failed on {{ inventory_hostname }} and
          tee_force_reboot_on_launch_failure is false, so the host was left alone.
          Read the reason above before deciding: if a previous guest is still reclaiming its
          memory it will clear on its own, and a plain `reboot` would hang. Re-run with
          -e tee_force_reboot_on_launch_failure=true to SysRq-reset and retry once.
          stderr={{ _qlaunch.stderr | default('') }}
      when: not (tee_force_reboot_on_launch_failure | default(false) | bool)

    # Opt-in only. Forced (SysRq) rather than graceful: see force_reboot.yml -- a graceful
    # reboot is what hangs in device_shutdown() on blocked unbinds.
    - name: Force-reboot host after a refused launch (opt-in)
      ansible.builtin.include_tasks: force_reboot.yml

    - name: Retry VM launch after reboot
      ansible.builtin.command:
        argv:
          - chutes-cvm
          - guest
          - launch
          - "{{ chutes_config_remote_path }}"
      register: _qlaunch_retry
      changed_when: true
      failed_when: false

    - name: Fail if the launch still fails after the reboot
      ansible.builtin.fail:
        msg: >-
          chutes-cvm guest launch still failing after a forced reboot
          (rc={{ _qlaunch_retry.rc }}). stderr={{ _qlaunch_retry.stderr | default('') }}
      when: _qlaunch_retry.rc != 0

- name: Poll node health until VM is registered and healthy
  ansible.builtin.command:
    argv:
      - chutes-miner
      - tee
      - node-health
      - --name
      - "{{ chutes_tee_server_name }}"
      - --hotkey
      - "{{ chutes_hotkey_path }}"
      - --miner-api
      - "{{ chutes_miner_api }}"
  delegate_to: localhost
  become: false
  register: _health_poll
  until: _health_poll.rc == 0
  retries: "{{ [((upgrade_health_poll_seconds | int) // 30), 1] | max }}"
  delay: 30

- name: Unlock server to resume gepetto scheduling
  ansible.builtin.command:
    argv:
      - chutes-miner
      - unlock
      - --name
      - "{{ chutes_tee_server_name }}"
      - --hotkey
      - "{{ chutes_hotkey_path }}"
      - --miner-api
      - "{{ chutes_miner_api }}"
  delegate_to: localhost
  become: false
