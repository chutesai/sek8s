---
# Example inventory for bare-metal TDX hosts.
# Copy outside the repo (e.g. ~/chutes/my-inventory.yml) and run:
#   ansible-playbook -i ~/chutes/my-inventory.yml playbooks/setup.yml
# Or keep a private file under inventory/ and gitignore it locally.
#
# Inventory host name (the key below) is used as chutes-miner --name in upgrade.yml unless you set tee_server_name.
# Name it the same as the TEE server in chutes-miner (often matches vm.hostname in config.yaml).
#
# Required host_vars / group_vars:
#   chutes_miner_ss58, chutes_miner_seed — guest miner credentials (use Vault; do not commit)
#   chutes_hotkey_path — path on the Ansible controller to the miner hotkey file (upgrade.yml)
#
# Optional:
#   tee_server_name           — override if inventory hostname is an SSH alias, not the miner API name
#   chutes_vm_hostname        — override vm.hostname in rendered config; default is inventory_hostname
#   chutes_guest_bridge_network — e.g. 192.168.50.0/24 when auto-picked bridge would be wrong
#   chutes_public_interface   — NIC for guest bridge; default is default-route interface
#   sek8s_remote_root    — default /opt/sek8s
#   ansible_user, ansible_ssh_private_key_file, ansible_port, etc.

all:
  children:
    td_hosts:
      hosts:
        chutes-miner-tee-0:
          ansible_host: 10.0.0.10
          ansible_user: ubuntu
