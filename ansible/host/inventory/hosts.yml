---
# Example inventory for bare-metal TDX hosts.
# Copy outside the repo (e.g. ~/chutes/my-inventory.yml) and run:
#   ansible-playbook -i ~/chutes/my-inventory.yml playbooks/setup.yml
# Or keep a private file under inventory/ and gitignore it locally.
#
# The inventory hostname is used as chutes-miner --name in shutdown/upgrade and as
# vm.hostname in config.yaml. Use the same name as the TEE server in chutes-miner.
# These must all match — do not use an SSH alias as the inventory key.

all:
  children:
    td_hosts:
      hosts:
        chutes-miner-tee-0:
          # ── SSH connection ────────────────────────────────────────────────
          ansible_host: 10.0.0.10
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          # ── Optional overrides ───────────────────────────────────────────
          # chutes_guest_bridge_network: ""  # e.g. 192.168.50.0/24; auto-picked when unset
          # chutes_public_interface: ""   # NIC for guest bridge; default is default-route interface
  vars:
    # ── Miner hotkey (launch / shutdown / upgrade) ───────────────────
    # ss58Address and secretSeed are extracted from this file automatically.
    chutes_hotkey_path: ~/.bittensor/wallets/mywallet/hotkeys/myhotkey

    # ── PCCS (setup only) — set BOTH or omit BOTH ────────────────────
    # Omitting both skips automated PCCS (prints a notice).
    # Setting only one fails with a remediation message.
    # pccs_api_key: ""        # Intel PCCS API key (use ansible-vault)
    # pccs_password: ""       # generates UserTokenHash/AdminTokenHash (use ansible-vault)

    # ── Optional overrides ───────────────────────────────────────────
    # chutes_miner_api: ""          # miner API URL; default http://127.0.0.1:32000
    # chutes_docker_hub_username: ""
    # chutes_docker_hub_token: ""   # use ansible-vault
