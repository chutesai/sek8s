---
# Staged base image download, maintenance, drain, shutdown, log wait, cutover, relaunch.
# Controller: chutes-miner, kubectl. chutes-miner --name comes from chutes_tee_server_name (group_vars/all.yml; override via tee_server_name in host_vars).
#
#   ansible-playbook -i ../inventory/hosts.yml playbooks/upgrade-guest.yml
#
#   # Drain + promote image but skip relaunch (e.g. to run remediate-host.yml next):
#   ansible-playbook -i ../inventory/hosts.yml playbooks/upgrade-guest.yml \
#     -e relaunch_vm=false
#
#   # Force upgrade even when validator denies maintenance (e.g. sole_survivor):
#   ansible-playbook -i ../inventory/hosts.yml playbooks/upgrade-guest.yml \
#     -e force_upgrade=true

- name: Upgrade TDX guest base image
  hosts: td_hosts
  serial: 1
  gather_facts: true
  become: true
  vars:
    chutes_config_remote_path: "{{ sek8s_remote_host_tools }}/scripts/config.yaml"
    staged_image_path: "/var/lib/chutes/base-images/{{ upgrade_staged_basename }}"
    relaunch_vm: true
    force_upgrade: false
  pre_tasks:
    - name: Require chutes_hotkey_path
      ansible.builtin.assert:
        that:
          - chutes_hotkey_path is defined
          - chutes_hotkey_path | length > 0
        fail_msg: "Set chutes_hotkey_path (e.g. group_vars or host_vars)."

  roles:
    - role: host_tools

  tasks:
    - name: Read EXPECTED_BASE_SHA256 from synced quick-launch.sh
      ansible.builtin.shell: |
        set -euo pipefail
        grep -E '^EXPECTED_BASE_SHA256=' "{{ sek8s_remote_host_tools }}/scripts/quick-launch.sh" | head -1 | cut -d= -f2 | tr -d '"' | tr -d "'"
      args:
        executable: /bin/bash
      register: expected_sha_raw
      changed_when: false

    - name: Set expected SHA fact
      ansible.builtin.set_fact:
        upgrade_expected_sha: "{{ expected_sha_raw.stdout | trim }}"

    - name: Stat current default base image
      ansible.builtin.stat:
        path: "{{ upgrade_default_base_image }}"
        get_checksum: false
      register: cur_base_stat

    - name: SHA256 of current default base image
      ansible.builtin.command:
        argv:
          - sha256sum
          - "{{ upgrade_default_base_image }}"
      register: cur_sha_out
      changed_when: false
      when: cur_base_stat.stat.exists

    - name: Set current image SHA fact
      ansible.builtin.set_fact:
        upgrade_current_sha: "{{ (cur_sha_out.stdout.split()[0]) if cur_base_stat.stat.exists else '' }}"

    - name: Stat staged image
      ansible.builtin.stat:
        path: "{{ staged_image_path }}"
        get_checksum: false
      register: staged_stat

    - name: SHA256 of staged image when present
      ansible.builtin.command:
        argv:
          - sha256sum
          - "{{ staged_image_path }}"
      register: staged_sha_cmd
      changed_when: false
      when: staged_stat.stat.exists

    - name: Set staged SHA fact
      ansible.builtin.set_fact:
        upgrade_staged_sha: "{{ (staged_sha_cmd.stdout.split()[0]) if staged_stat.stat.exists else '' }}"

    - name: No-op when default image already matches expected and no staged file
      ansible.builtin.debug:
        msg: "Base image already at expected SHA256; nothing to upgrade."
      when:
        - upgrade_current_sha == upgrade_expected_sha
        - not staged_stat.stat.exists

    - name: End when already upgraded
      ansible.builtin.meta: end_host
      when:
        - upgrade_current_sha == upgrade_expected_sha
        - not staged_stat.stat.exists

    - name: Remove stray staged file when default image already matches expected
      ansible.builtin.file:
        path: "{{ staged_image_path }}"
        state: absent
      when:
        - upgrade_current_sha == upgrade_expected_sha
        - staged_stat.stat.exists

    - name: End after cleaning stray staged artifact
      ansible.builtin.meta: end_host
      when:
        - upgrade_current_sha == upgrade_expected_sha
        - staged_stat.stat.exists

    - name: Download staged base image when missing or checksum wrong
      ansible.builtin.command:
        argv:
          - aria2c
          - -x
          - "16"
          - -s
          - "16"
          - -k
          - 1M
          - -d
          - /var/lib/chutes/base-images
          - -o
          - "{{ upgrade_staged_basename }}"
          - "{{ upgrade_base_image_url }}"
      when: upgrade_staged_sha != upgrade_expected_sha
      register: aria_dl
      changed_when: true

    - name: Re-stat staged image
      ansible.builtin.stat:
        path: "{{ staged_image_path }}"
        get_checksum: false
      register: staged_stat

    - name: SHA256 staged image after download
      ansible.builtin.command:
        argv:
          - sha256sum
          - "{{ staged_image_path }}"
      register: staged_sha_cmd
      changed_when: false
      failed_when: staged_sha_cmd.rc != 0

    - name: Refresh staged SHA fact
      ansible.builtin.set_fact:
        upgrade_staged_sha: "{{ staged_sha_cmd.stdout.split()[0] }}"

    - name: Verify staged image matches quick-launch expectation
      ansible.builtin.assert:
        that:
          - upgrade_staged_sha == upgrade_expected_sha
        fail_msg: >-
          Staged image checksum {{ upgrade_staged_sha }} != expected {{ upgrade_expected_sha }}.
          Delete {{ staged_image_path }} and re-run.

    - name: Drain pods and shut down guest
      ansible.builtin.include_role:
        name: chutes_tee_vm
        tasks_from: drain_and_shutdown.yml

    - name: Backup current base qcow2 by date
      ansible.builtin.command:
        argv:
          - mv
          - "{{ upgrade_default_base_image }}"
          - "/var/lib/chutes/base-images/tdx-guest-{{ ansible_date_time.date }}.qcow2"

    - name: Promote staged image to default path
      ansible.builtin.command:
        argv:
          - mv
          - "{{ staged_image_path }}"
          - "{{ upgrade_default_base_image }}"

    - name: Relaunch VM and verify node health
      ansible.builtin.include_role:
        name: chutes_tee_vm
        tasks_from: launch_and_verify.yml
      vars:
        # Image was just verified above — pass SHA so launch_and_verify skips recompute.
        _prevalidated_base_sha: "{{ upgrade_expected_sha }}"
      when: relaunch_vm | bool
