---
# Bootstrap base image (if missing), render config.yaml on host, run quick-launch.sh.
#
# Required (host_vars / group_vars / Vault):
#   chutes_miner_ss58, chutes_miner_seed — miner credentials for the guest config
#
# Optional:
#   chutes_config_remote_path — default {{ sek8s_remote_host_tools }}/scripts/config.yaml
#   chutes_vm_hostname — vm.hostname; default is inventory_hostname
#   chutes_guest_bridge_network — e.g. 192.168.50.0/24; default picks a /24 that does not overlap host IPv4
#   chutes_public_interface — override default-route NIC used for the guest bridge
#   chutes_docker_hub_username / chutes_docker_hub_token — optional docker_hub block
#
# On checksum mismatch for an existing image, quick-launch fails; run upgrade.yml or fix the image manually.
# If a chutes-td QEMU guest is already running, launch fails immediately; use playbooks/shutdown.yml first.

- name: Launch TDX guest VM
  hosts: td_hosts
  gather_facts: true
  become: true
  vars:
    chutes_config_remote_path: "{{ sek8s_remote_host_tools }}/scripts/config.yaml"
    host_tools_local: "{{ playbook_dir | dirname | dirname | dirname }}/host-tools"

  pre_tasks:
    - name: Refuse launch while a chutes-td guest is already running
      ansible.builtin.include_role:
        name: chutes_tee_vm
        tasks_from: assert_not_running.yml

  roles:
    - role: host_tools
    - role: host_prerequisites

  tasks:
    - name: Resolve default base image path on host
      ansible.builtin.set_fact:
        launch_base_image: "{{ upgrade_default_base_image }}"

    - name: Check if base image exists
      ansible.builtin.stat:
        path: "{{ launch_base_image }}"
      register: base_img_stat

    - name: Download base image when missing
      ansible.builtin.command:
        chdir: "{{ sek8s_remote_host_tools }}/scripts"
        argv:
          - ./quick-launch.sh
          - --download
      when: not base_img_stat.stat.exists
      register: qdl
      changed_when: true

    - name: Re-check base image after download
      ansible.builtin.stat:
        path: "{{ launch_base_image }}"
      register: base_img_stat

    - name: Fail when base image is still missing
      ansible.builtin.fail:
        msg: >-
          Base image missing at {{ launch_base_image }}.
          Ensure aria2 is installed, disk space is available, and vm.chutes.ai is reachable.
      when: not base_img_stat.stat.exists

    - name: Render config.yaml on host (hostname, miner, network)
      ansible.builtin.include_role:
        name: chutes_vm_config

    - name: Run quick-launch (checksum verify + start VM)
      ansible.builtin.command:
        chdir: "{{ sek8s_remote_host_tools }}/scripts"
        argv:
          - ./quick-launch.sh
          - "{{ chutes_config_remote_path }}"
      register: qlaunch
      changed_when: qlaunch.rc == 0
      failed_when: false

    - name: Hand off to upgrade playbook on launch failure (often checksum mismatch)
      ansible.builtin.fail:
        msg: >-
          quick-launch.sh failed (rc={{ qlaunch.rc }}). If the base image exists but does not match
          the expected SHA256 in quick-launch.sh, run the upgrade playbook:
            ansible-playbook -i <inventory> ansible/host/playbooks/upgrade.yml
          Or replace/remove the qcow2 manually per host-tools/README.md.
      when: qlaunch.rc != 0
