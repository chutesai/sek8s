---
# Common variables for all hosts

# System configuration
ansible_port: 22
ansible_ssh_common_args: -o StrictHostKeyChecking=no
timezone: UTC
swap_disable: true

# System packages to install
system_packages:
  - curl
  - wget
  - vim
  - iproute2
  - socat
  - conntrack
  - ipset
  - jq
  - apt-transport-https
  - ca-certificates
  - gnupg-agent
  - software-properties-common

# Networking configuration (used by all)
k3s_api_port: "6443"
cluster_cidr: 10.42.0.0/16
service_cidr: 10.43.0.0/16

# K3s Configuration
k3s_version: v1.33.7+k3s1

# Ubuntu major/minor version.
ubuntu_major: "24"
ubuntu_minor: "04"
# CUDA version - leave as-is unless using h200s, in which case either use 12-5 or skip_cuda: true (if provider already pre-installed drivers)
cuda_version: "13-0"
# NVIDIA driver branch (Ubuntu restricted + linux-modules-nvidia-*-open)
nvidia_version: "590"
# Ubuntu restricted pin (libs, headless-no-dkms, dkms source meta, utils, firmware version, etc.)
nvidia_pkg_release_ubuntu: "48.01-0ubuntu0.24.04.4"
# CUDA repo pin (fabricmanager, nvidia-modprobe, nvidia-settings at 590.48.01 — not on Ubuntu main at this build)
nvidia_pkg_release_cuda: "48.01-0ubuntu1"
# Firmware package name includes the branch twice (e.g. nvidia-firmware-590-590.48.01)
nvidia_firmware_pkg: "nvidia-firmware-590-590.48.01"
# Prebuilt open modules: do not install nvidia-driver-*-open + nvidia-dkms-*-open alongside
# linux-modules-nvidia-*-open (same .ko paths → dpkg/DKMS failure). Use headless-no-dkms + MOD_PKG.
# Flag to skip the cuda install entirely, if the provider already has cuda 12.x+ installed (note some chutes will not work unless 12.6+)
skip_cuda: false
# Flag to enable/disable IPv6. Some hosts may require IPv6 to be on.
ipv6_enabled: true

# Module Security Configuration
enable_module_security: true
enable_module_signing: true

# Attestation settings
attestation_endpoint: "{{ lookup('env', 'ATTESTATION_ENDPOINT') | default('https://api.example.com/attestation', true) }}"
attestation_interval: 300  # 5 minutes

# Module monitoring
module_monitoring_enabled: true
alert_on_unsigned_modules: true
alert_on_tainted_kernel: true

# Critical modules that must always be present
critical_kernel_modules:
  - overlay
  - br_netfilter
  - nf_conntrack
  - iptable_nat
  - iptable_filter
  - ip_tables