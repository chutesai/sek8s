---
- name: Ensure supplemental groups exist for system manager
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
    system: yes
  loop:
    - systemd-journal
    - video

- name: Ensure tdx-attest group exists for TLS sharing
  ansible.builtin.group:
    name: tdx-attest
    gid: 987
    state: present
    system: yes

- name: Create chutes user (for system-manager service)
  ansible.builtin.user:
    name: chutes
    system: yes
    shell: /usr/sbin/nologin
    create_home: no
    groups: "sek8s,systemd-journal,video,tdx-attest"
    append: yes
    home: /opt/sek8s

- name: Create directories for system manager service
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/system-manager, owner: root, group: chutes, mode: '0750' }
    - { path: /var/log/system-manager, owner: chutes, group: chutes, mode: '0750' }

- name: Deploy system manager environment file
  ansible.builtin.template:
    src: system-manager.env.j2
    dest: /etc/system-manager/system-manager.env
    owner: root
    group: chutes
    mode: '0640'

- name: Install system manager service
  ansible.builtin.copy:
    src: system-manager.service
    dest: /etc/systemd/system/system-manager.service
    owner: root
    group: root
    mode: '0644'

- name: Create system manager drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/system-manager.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy security drop-in
  ansible.builtin.copy:
    src: system-manager.conf
    dest: /etc/systemd/system/system-manager.service.d/10-security.conf
    owner: root
    group: root
    mode: '0644'

- name: Allow chutes user to execute shutdown and du without password
  ansible.builtin.copy:
    content: |
      # Allow system-manager service to perform graceful shutdown
      chutes ALL=(ALL) NOPASSWD: /sbin/shutdown
      # Allow system-manager service to read all directories for disk usage analysis
      chutes ALL=(ALL) NOPASSWD: /usr/bin/du
    dest: /etc/sudoers.d/system-manager
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'

- name: Enable and start system manager
  ansible.builtin.systemd:
    name: system-manager.service
    enabled: yes
    state: started
    daemon_reload: yes
