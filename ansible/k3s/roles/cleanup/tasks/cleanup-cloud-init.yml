---
- name: Purge cloud-init packages
  ansible.builtin.apt:
    name:
      - cloud-init
      - cloud-guest-utils
    state: absent
    purge: yes

- name: Remove residual cloud-init state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/cloud
    - /etc/cloud
    - /var/log/cloud-init.log
    - /var/log/cloud-init-output.log
    - /run/cloud-init

- name: Clean package manager cache
  ansible.builtin.apt:
    autoclean: yes
    autoremove: yes

- name: Clean apt lists
  ansible.builtin.shell: |
    rm -rf /var/lib/apt/lists/*

- name: Clear bash history
  ansible.builtin.shell: |
    history -c
    > /root/.bash_history
  ignore_errors: yes

- name: Create success marker
  ansible.builtin.file:
    path: /root/cleanup-complete
    state: touch
    mode: '0644'