---
- name: Ensure /etc/chutes exists
  ansible.builtin.file:
    path: /etc/chutes
    state: directory
    mode: '0755'

- name: Install Helm PGP keyring for chart provenance verification
  ansible.builtin.copy:
    src: "{{ helm_chart_public_key_path }}"
    dest: /etc/chutes/helm-pubkey.gpg
    mode: '0644'

- name: Create Helm config directories for build-time and boot-time use
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ helm_config_home }}"
    - "{{ helm_cache_home }}"
    - "{{ helm_data_home }}"

- name: Add Chutes Helm repository to pre-configured Helm paths
  ansible.builtin.shell: |
    helm repo add chutes {{ chutes_helm_repo_url | quote }}
    helm repo update
  environment:
    HELM_CONFIG_HOME: "{{ helm_config_home }}"
    HELM_CACHE_HOME: "{{ helm_cache_home }}"
    HELM_DATA_HOME: "{{ helm_data_home }}"
  args:
    executable: /bin/bash

- name: Generate Chutes values file
  ansible.builtin.template:
    src: chutes-values.yaml.j2
    dest: /tmp/chutes-values.yaml
    mode: '0644'
  when: (chutes_gpu_values | default({}) | length) > 0

- name: Install or upgrade Chutes GPU charts
  ansible.builtin.shell: |
    helm upgrade --install chutes chutes/chutes-miner-gpu \
      --namespace chutes \
      --create-namespace \
      {% if chutes_chart_version is defined and chutes_chart_version %}
      --version {{ chutes_chart_version | quote }} \
      {% endif %}
      --verify --keyring /etc/chutes/helm-pubkey.gpg \
      --set-string minerCredentials.ss58Address="REPLACE_ME" \
      --set-string minerCredentials.secretSeed="REPLACE_ME" \
      {% if (chutes_gpu_values | default({}) | length) > 0 %}
      -f /tmp/chutes-values.yaml \
      {% endif %}
      --kubeconfig=/etc/rancher/k3s/k3s.yaml
  environment:
    HELM_CONFIG_HOME: "{{ helm_config_home }}"
    HELM_CACHE_HOME: "{{ helm_cache_home }}"
    HELM_DATA_HOME: "{{ helm_data_home }}"
  register: miner_deployment
  changed_when: miner_deployment.rc == 0
  no_log: true

- name: Display deployment result
  ansible.builtin.debug:
    msg: "Miner GPU deployment on {{ inventory_hostname }}: {{ 'SUCCESS' if miner_deployment.rc == 0 else 'FAILED' }}"

- name: Ensure chart version marker directory exists
  ansible.builtin.file:
    path: /etc/chutes/chart-versions
    state: directory
    mode: '0755'
  when: miner_deployment.rc == 0

- name: Get installed chart version
  ansible.builtin.shell: |
    chart_full=$(helm list -n chutes -o json --kubeconfig=/etc/rancher/k3s/k3s.yaml | jq -r '.[0].chart')
    echo "${chart_full#chutes-miner-gpu-}"
  args:
    executable: /bin/bash
  register: chart_version_output
  changed_when: false
  when: miner_deployment.rc == 0

- name: Write chart version marker
  ansible.builtin.copy:
    content: "{{ chart_version_output.stdout }}"
    dest: /etc/chutes/chart-versions/chutes-miner-gpu
    mode: '0644'
  when: miner_deployment.rc == 0

- name: Delete dummy miner credentials
  kubernetes.core.k8s:
    name: miner-credentials
    api_version: v1
    kind: Secret
    namespace: chutes
    state: absent