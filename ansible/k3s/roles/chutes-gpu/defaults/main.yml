monitoring_namespace: monitoring

# Chutes chart version from the chutes Helm repo (chutes/chutes-miner-gpu).
# Leave unset to use the latest chart. Set to a specific version (e.g. 0.1.0-dev.1)
# to test development charts before release, or when using a debug image.
# chutes_chart_version: 0.1.0-dev.1
chutes_chart_version: null

# Chutes validator configuration
# Provide the full validators YAML structure as shown in the chart documentation
# This can be overridden in group_vars or host_vars
chutes_validators: {}
# Example:
# chutes_validators:
#   defaultRegistry: registry.dev
#   defaultApi: https://registry.dev
#   supported:
#     - hotkey: 5FAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
#       registry: registry.dev
#       api: https://regisitry.dev
#       socket: wss://ws.registry.dev:6443