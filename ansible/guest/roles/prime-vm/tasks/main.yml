---
- name: Set host tools scripts path
  ansible.builtin.set_fact:
    host_tools_scripts: "{{ repo_root }}/host-tools/scripts"

- name: Check no TDX VM is running
  block:
    - name: Fail if TDX VM is running
      ansible.builtin.shell: |
        if [ -f /tmp/tdx-td-pid.pid ]; then
          PID=$(cat /tmp/tdx-td-pid.pid)
          if kill -0 "$PID" 2>/dev/null; then
            echo "A TDX VM is already running (PID $PID)."
            echo "run-td uses shared paths (/tmp/tdx-td-pid.pid, /tmp/tdx-guest-td.log) so prime cannot run alongside it."
            echo "Stop the VM first, then re-run the build or use --tags prime-vm to prime the image."
            exit 1
          fi
        fi
      args:
        executable: /bin/bash

- name: Prime VM for stable TDX measurements
  block:
    - name: Set prime launched flag
      ansible.builtin.set_fact:
        prime_launched: false

    - name: Create prime directory
      ansible.builtin.file:
        path: "{{ prime_dir }}"
        state: directory
        mode: "0755"

    - name: Create prime config volume
      ansible.builtin.command:
        cmd: >
          {{ host_tools_scripts }}/volumes/create-config.sh
          {{ prime_dir }}/config.qcow2
          {{ prime_dummy_hostname }}
          {{ prime_dummy_ss58 }}
          {{ prime_dummy_seed }}
          {{ prime_vm_ip }}
          {{ prime_vm_gateway }}
          {{ prime_vm_dns }}

    - name: Create prime cache volume
      ansible.builtin.command:
        cmd: "{{ host_tools_scripts }}/volumes/create-cache.sh {{ prime_dir }}/cache.raw 1G tdx-cache"

    - name: Create prime storage volume
      ansible.builtin.command:
        cmd: "{{ host_tools_scripts }}/volumes/create-cache.sh {{ prime_dir }}/storage.raw 1G storage"

    - name: Stop any existing TDX VM
      ansible.builtin.command: "{{ host_tools_scripts }}/run-td --clean"
      changed_when: false
      failed_when: false

    - name: Brief pause after cleanup to avoid transient race
      ansible.builtin.shell: sleep 3
      changed_when: false

    - name: Clear QEMU log from previous runs
      ansible.builtin.file:
        path: /tmp/tdx-guest-td.log
        state: absent

    - name: Launch VM for prime
      ansible.builtin.shell: |
        cd {{ host_tools_scripts }}
        python3 ./run-td \
          --image {{ final_img_path }} \
          --config-volume {{ prime_dir }}/config.qcow2 \
          --cache-volume {{ prime_dir }}/cache.raw \
          --storage-volume {{ prime_dir }}/storage.raw \
          --network-type user
      args:
        executable: /bin/bash
      register: launch_result

    - name: Mark that we launched a VM
      ansible.builtin.set_fact:
        prime_launched: true

    - name: Debug run-td launch output
      ansible.builtin.debug:
        msg:
          - "run-td exit code: {{ launch_result.rc }}"
          - "run-td stdout: {{ launch_result.stdout | default('') | trim }}"
          - "run-td stderr: {{ launch_result.stderr | default('') | trim }}"

    - name: Wait for QEMU to exit or timeout
      ansible.builtin.shell: |
        set -e
        PIDFILE=/tmp/tdx-td-pid.pid
        TIMEOUT={{ prime_wait_timeout }}
        if [ -f "$PIDFILE" ]; then
          PID=$(cat "$PIDFILE")
          ELAPSED=0
          while kill -0 "$PID" 2>/dev/null && [ $ELAPSED -lt $TIMEOUT ]; do
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo "Timeout reached ({{ prime_wait_timeout }}s), sending SIGTERM to QEMU"
            kill -TERM "$PID" 2>/dev/null || true
            sleep 5
            kill -KILL "$PID" 2>/dev/null || true
          fi
        fi
      args:
        executable: /bin/bash

    - name: Dump QEMU log for debugging
      ansible.builtin.shell: |
        if [ -f /tmp/tdx-guest-td.log ]; then
          echo "=== Last 100 lines of /tmp/tdx-guest-td.log ==="
          tail -100 /tmp/tdx-guest-td.log
        else
          echo "Log file /tmp/tdx-guest-td.log does not exist"
        fi
      args:
        executable: /bin/bash
      register: qemu_log_dump
      changed_when: false

    - name: Debug QEMU log contents
      ansible.builtin.debug:
        msg: "{{ qemu_log_dump.stdout_lines }}"

    - name: Verify prime succeeded (VM completed boot cycle)
      ansible.builtin.shell: |
        if [ ! -f /tmp/tdx-guest-td.log ]; then
          echo "Log file missing - VM may not have started"
          exit 1
        fi
        if [ ! -s /tmp/tdx-guest-td.log ]; then
          echo "Log file is empty - VM may not have produced output"
          exit 1
        fi
        if ! grep -q "Power down" /tmp/tdx-guest-td.log; then
          echo "Log does not contain 'Power down' - VM may not have completed boot cycle"
          exit 1
        fi
      args:
        executable: /bin/bash
      register: prime_verify
      failed_when: prime_verify.rc != 0

    - name: Compute sha256 of primed image
      ansible.builtin.shell: sha256sum "{{ final_img_path }}" | awk '{print $1}'
      register: primed_image_sha256
      changed_when: false

    - name: Output primed image SHA256 for quick-launch.sh
      ansible.builtin.debug:
        msg:
          - "Prime succeeded. Update EXPECTED_BASE_SHA256 in host-tools/scripts/quick-launch.sh:"
          - "  EXPECTED_BASE_SHA256=\"{{ primed_image_sha256.stdout }}\""
          - ""
          - "Image: {{ final_img_path }}"
          - "SHA256: {{ primed_image_sha256.stdout }}"

  rescue:
    - name: Prime failed - debug output
      ansible.builtin.debug:
        msg:
          - "run-td exit code: {{ launch_result.rc | default('N/A') }}"
          - "run-td stdout: {{ launch_result.stdout | default('') | trim }}"
          - "run-td stderr: {{ launch_result.stderr | default('') | trim }}"
      when: launch_result is defined

    - name: Dump QEMU log on failure
      ansible.builtin.shell: |
        if [ -f /tmp/tdx-guest-td.log ]; then
          echo "=== /tmp/tdx-guest-td.log ==="
          tail -100 /tmp/tdx-guest-td.log
        else
          echo "Log file does not exist"
        fi
      args:
        executable: /bin/bash
      register: rescue_log
      changed_when: false

    - name: Debug QEMU log on failure
      ansible.builtin.debug:
        msg: "{{ rescue_log.stdout_lines }}"

    - name: Fail with verbose message for investigation
      ansible.builtin.fail:
        msg: |
          Prime VM failed. Check run-td output and /tmp/tdx-guest-td.log above.
          Re-run with --tags prime-vm after resolving the root cause.

  always:
    - name: Ensure VM is stopped before cleanup
      ansible.builtin.command: "{{ host_tools_scripts }}/run-td --clean"
      changed_when: false
      failed_when: false
      when: prime_launched | default(false) | bool

    - name: Remove prime volumes and directory
      ansible.builtin.file:
        path: "{{ prime_dir }}"
        state: absent
