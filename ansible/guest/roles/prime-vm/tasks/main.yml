---
# prime-vm — Boot the sealed VM once to prime TDVF's EFI boot variable state.
#
# On first boot of a freshly built image, TDVF has no saved EFI NVRAM entries
# and falls back to scanning PCI devices to find the bootloader.  It then boots
# via the generic fallback path ("UEFI Misc Device") rather than the named
# Ubuntu entry ("Boot000N: Ubuntu").  This produces different RTMR values than
# all subsequent boots, where TDVF loads directly from the saved Ubuntu entry.
#
# This role boots the image once so TDVF writes the Ubuntu EFI boot entry into
# its NVRAM.  All future boots — including the partner's first boot — then use
# the stable named entry and produce consistent, verifiable RTMRs.
#
# The VM is launched with user-mode networking (no volumes, no partner keys
# reachable) and force-killed as soon as the kernel boot signal appears in the
# serial console log.  No credentials or secrets are required.
#
# grub-set-default 0 (written to /boot/grub/grubenv by the disable-console
# role) ensures GRUB also selects entry 0 deterministically, complementing
# the EFI variable priming done here.

- name: Set host tools scripts path
  ansible.builtin.set_fact:
    host_tools_scripts: "{{ repo_root }}/host-tools/scripts"

- name: Check no TDX VM is running
  ansible.builtin.shell: |
    if [ -f /tmp/tdx-td-pid.pid ]; then
      PID=$(cat /tmp/tdx-td-pid.pid)
      if kill -0 "$PID" 2>/dev/null; then
        echo "A TDX VM is already running (PID $PID)."
        echo "Stop it first, then re-run the build or use --tags prime-vm to prime the image."
        exit 1
      fi
    fi
  args:
    executable: /bin/bash

- name: Prime VM EFI boot variable state
  block:
    - name: Set prime launched flag
      ansible.builtin.set_fact:
        prime_launched: false

    - name: Stop any existing TDX VM
      ansible.builtin.command: "{{ host_tools_scripts }}/run-td --clean"
      changed_when: false
      failed_when: false

    - name: Brief pause after cleanup
      ansible.builtin.shell: sleep 3
      changed_when: false

    - name: Clear QEMU log from previous runs
      ansible.builtin.file:
        path: /tmp/tdx-guest-td.log
        state: absent

    - name: Launch VM for prime (user-mode networking, no volumes)
      ansible.builtin.shell: |
        cd {{ host_tools_scripts }}
        python3 ./run-td \
          --image {{ final_img_path }} \
          --network-type user
      args:
        executable: /bin/bash
      register: launch_result

    - name: Mark that we launched a VM
      ansible.builtin.set_fact:
        prime_launched: true

    - name: Debug run-td launch output
      ansible.builtin.debug:
        msg:
          - "run-td exit code: {{ launch_result.rc }}"
          - "run-td stdout: {{ launch_result.stdout | default('') | trim }}"
          - "run-td stderr: {{ launch_result.stderr | default('') | trim }}"

    - name: Wait for kernel boot signal in console log
      ansible.builtin.shell: |
        LOGFILE=/tmp/tdx-guest-td.log
        SIGNAL="{{ prime_boot_signal }}"
        TIMEOUT={{ prime_boot_timeout }}
        ELAPSED=0
        until grep -q "$SIGNAL" "$LOGFILE" 2>/dev/null; do
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "Timeout (${TIMEOUT}s) waiting for boot signal '${SIGNAL}' in ${LOGFILE}"
            exit 1
          fi
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done
        echo "Boot signal detected after ${ELAPSED}s:"
        grep "$SIGNAL" "$LOGFILE" | head -1
      args:
        executable: /bin/bash
      register: boot_signal_result

    - name: Debug boot signal
      ansible.builtin.debug:
        msg: "{{ boot_signal_result.stdout_lines }}"

    - name: Kill VM now that EFI boot entry is committed
      ansible.builtin.shell: |
        PIDFILE=/tmp/tdx-td-pid.pid
        if [ -f "$PIDFILE" ]; then
          PID=$(cat "$PIDFILE")
          if kill -0 "$PID" 2>/dev/null; then
            kill -TERM "$PID"
            sleep 3
            kill -KILL "$PID" 2>/dev/null || true
          fi
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Compute sha256 of primed image
      ansible.builtin.shell: sha256sum "{{ final_img_path }}" | awk '{print $1}'
      register: primed_image_sha256
      changed_when: false

    - name: Output primed image SHA256 for quick-launch.sh
      ansible.builtin.debug:
        msg:
          - "Prime succeeded. Update EXPECTED_BASE_SHA256 in host-tools/scripts/quick-launch.sh:"
          - "  EXPECTED_BASE_SHA256=\"{{ primed_image_sha256.stdout }}\""
          - ""
          - "Image: {{ final_img_path }}"
          - "SHA256: {{ primed_image_sha256.stdout }}"

  rescue:
    - name: Prime failed — debug output
      ansible.builtin.debug:
        msg:
          - "run-td exit code: {{ launch_result.rc | default('N/A') }}"
          - "run-td stdout: {{ launch_result.stdout | default('') | trim }}"
          - "run-td stderr: {{ launch_result.stderr | default('') | trim }}"
      when: launch_result is defined

    - name: Dump QEMU log on failure
      ansible.builtin.shell: |
        if [ -f /tmp/tdx-guest-td.log ]; then
          echo "=== /tmp/tdx-guest-td.log ==="
          tail -100 /tmp/tdx-guest-td.log
        else
          echo "Log file does not exist"
        fi
      args:
        executable: /bin/bash
      register: rescue_log
      changed_when: false

    - name: Debug QEMU log on failure
      ansible.builtin.debug:
        msg: "{{ rescue_log.stdout_lines }}"

    - name: Fail with verbose message for investigation
      ansible.builtin.fail:
        msg: |
          Prime VM failed. Check run-td output and /tmp/tdx-guest-td.log above.
          Re-run with --tags prime-vm after resolving the root cause.

  always:
    - name: Ensure VM is stopped after prime
      ansible.builtin.command: "{{ host_tools_scripts }}/run-td --clean"
      changed_when: false
      failed_when: false
      when: prime_launched | default(false) | bool
