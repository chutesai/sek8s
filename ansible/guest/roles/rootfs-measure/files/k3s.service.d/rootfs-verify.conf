[Unit]
# Hard dependency: k3s must not start if rootfs-verify has not confirmed that
# the live filesystem (including storage bind-mounts) matches what was measured
# at init-bottom (hardware RTMR3 on TDX, the manifest-verified list on SEV-SNP).  rootfs-verify powers off the VM on any
# mismatch, so this Requires= is defence-in-depth — it structurally blocks k3s
# even if the poweroff path somehow fails to execute.
Requires=rootfs-verify.service
After=rootfs-verify.service
