[Unit]
# Ordered after the perms unit that chgrp's the fetched keys to chutes-keys.
After=signing-keys-config.service
Wants=signing-keys-config.service

[Service]
# Read the fetched cosign public keys under /run/chutes/signing-keys. /run/chutes
# is 0700, so bind this subtree in directly (the public keys are world-readable).
# Optional (-): the path is minted by the initramfs at boot and is absent during
# the build, when admission-controller is also started. SupplementaryGroups is
# belt-and-suspenders for future group-only gating (keys are world-readable today).
SupplementaryGroups=chutes-keys
BindReadOnlyPaths=-/run/chutes/signing-keys
