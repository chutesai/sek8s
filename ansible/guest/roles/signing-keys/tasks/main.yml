---
# signing-keys — Bake the root RSA public key (PEM) into /etc/chutes/ (measured
# by RTMR3) and install the initramfs fetch/verify machinery.

# ── Validate build-host prerequisites ───────────────────────────────────────

- name: Stat root signing key on build host
  ansible.builtin.stat:
    path: "{{ root_signing_key_path }}"
  delegate_to: localhost
  become: false
  register: _root_key_stat

- name: Assert root signing key exists
  ansible.builtin.assert:
    that: _root_key_stat.stat.exists
    fail_msg: >-
      Root RSA public key (PEM) not found at {{ root_signing_key_path }}.

# ── Install root RSA public key and URL config ───────────────────────────────

- name: Ensure /etc/chutes directory exists
  ansible.builtin.file:
    path: /etc/chutes
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install root RSA signing key (PEM)
  ansible.builtin.copy:
    src: "{{ root_signing_key_path }}"
    dest: /etc/chutes/root-signing-key.pem
    owner: root
    group: root
    mode: '0644'

- name: Install signing-keys.conf
  ansible.builtin.template:
    src: signing-keys.conf.j2
    dest: /etc/chutes/signing-keys.conf
    owner: root
    group: root
    mode: '0644'

# openssl (the RSA verifier) is already staged into the initramfs by the LUKS
# fetch_key hook, so no extra binary is installed here.

# ── Install initramfs hook and init-bottom script ────────────────────────────

- name: Install fetch-signing-keys initramfs hook
  ansible.builtin.copy:
    src: initramfs/fetch-signing-keys-hook
    dest: /etc/initramfs-tools/hooks/fetch-signing-keys
    owner: root
    group: root
    mode: '0755'
  notify: update initramfs

- name: Install fetch-signing-keys init-bottom script
  ansible.builtin.copy:
    src: initramfs/fetch-signing-keys
    dest: /etc/initramfs-tools/scripts/init-bottom/fetch-signing-keys
    owner: root
    group: root
    mode: '0755'
  notify: update initramfs

# ── Shared key-access group ──────────────────────────────────────────────────
# The fetched keys land under 0700 /run/chutes owned root:root. Any service that
# needs to verify signatures (admission-controller today, more later) joins the
# chutes-keys group and binds /run/chutes/signing-keys into its namespace. The
# signing-keys-config oneshot chgrp's the subtree to this group at boot.

- name: Create chutes-keys group (shared read access to fetched signing keys)
  ansible.builtin.group:
    name: chutes-keys
    system: true

- name: Install signing-keys-config service
  ansible.builtin.copy:
    src: signing-keys-config.service
    dest: /etc/systemd/system/signing-keys-config.service
    owner: root
    group: root
    mode: '0644'

- name: Enable signing-keys-config service
  ansible.builtin.systemd:
    name: signing-keys-config.service
    enabled: true
    daemon_reload: true
