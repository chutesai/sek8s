[Service]
PrivateTmp=true
ProtectSystem=full
ProtectHome=true
ReadWritePaths=/var/log/system-manager /run/system-manager
# Access k3s containerd socket (system-manager in containerd group).
# Prefixed with '-' so system-manager can start before k3s creates
# the socket directory -- containerd features degrade gracefully.
ReadOnlyPaths=-/run/k3s/containerd
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectClock=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=true
LockPersonality=true
MemoryDenyWriteExecute=true
RestrictRealtime=true
RemoveIPC=true

# Device access
PrivateDevices=false
DevicePolicy=auto

# CAP_SETUID/SETGID let the service sudo to the few allowlisted root commands
# (shutdown, du, cache-rm). CAP_DAC_OVERRIDE is the *ceiling* that lets the
# sudo->root cache-rm child unlink chute-pod-owned files (uid 1000, not
# group-writable) under /var/snap/cache; without it root still fails DAC checks
# with EACCES. AmbientCapabilities stays empty, so the long-running FastAPI
# process (non-root, no inherited caps) holds NO capabilities — only a
# sudo-escalated, sudoers-allowlisted command can ever hold CAP_DAC_OVERRIDE,
# and the only one that touches files (cache-rm) is path-restricted to direct
# children of the cache base.
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_AUDIT_WRITE CAP_DAC_OVERRIDE
AmbientCapabilities=
# Allow headroom for download (httpx pool + verify/chmod) + systemctl/journalctl/nvidia-smi/du.
# 128 was too low; fork failed with EAGAIN when at limit during downloads.
TasksMax=1024
LimitNPROC=1024
LimitNOFILE=65536
