[Service]
PrivateTmp=true
ProtectSystem=full
ProtectHome=true
ReadWritePaths=/var/log/system-manager /run/system-manager /var/snap/cache
# Access k3s containerd socket (system-manager in containerd group)
ReadOnlyPaths=/run/k3s/containerd
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectClock=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=true
LockPersonality=true
MemoryDenyWriteExecute=true
RestrictRealtime=true
RemoveIPC=true

# Device access
PrivateDevices=false
DevicePolicy=auto

CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_AUDIT_WRITE
AmbientCapabilities=
# Allow headroom for download (httpx pool + verify/chmod) + systemctl/journalctl/nvidia-smi/du.
# 128 was too low; fork failed with EAGAIN when at limit during downloads.
TasksMax=1024
LimitNPROC=1024
LimitNOFILE=65536
