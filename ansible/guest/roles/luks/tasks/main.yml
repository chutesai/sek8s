---
# The luks role runs for ALL guest images (the chutes-miner-vm playbook no longer
# gates the play). The prod-vs-debug split is decided HERE, in one place, so it is
# auditable at a glance: exactly one of the two task sets runs, and each is
# all-or-nothing. This mirrors the k3s role convention — gate the include, never
# individual tasks inside a security-critical set.
#
#   prod.yml  — encrypts the root filesystem and installs the fail-CLOSED prod
#               initramfs (LUKS unlock + root rotation). Distinct measurement.
#   debug.yml — installs the fail-OPEN debug initramfs (static k3s key, no LUKS) and
#               performs NO encryption. Distinct measurement. The debug-only *_debug
#               entries are installed ONLY by this set, so prod carries none of that code.

- name: Encrypt root filesystem and install production initramfs
  ansible.builtin.include_tasks: prod.yml
  tags: luks-prod
  when: not (debug_build | default(false))

- name: Install debug initramfs (no encryption)
  ansible.builtin.include_tasks: debug.yml
  tags: luks-debug
  when: debug_build | default(false)
