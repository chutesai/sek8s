backup_dir: /mnt/backup
root_mount: /mnt/root
newroot_mount: /mnt/newroot
nbd_device: /dev/nbd0
encrypted_root_name: encrypted_root
# Image output env label (override in inventory); used in final_img_path below
build_env: "dev"
final_img_path: "{{ img_dir }}/{{ build_env }}/{{ vm_version | default('0.0.0') }}{{ '-debug' if debug_build | default(false) else '' }}.qcow2"

# TDX-specific configuration
# tdx_base_url: mTLS proxy (boot attestation + LUKS passphrase endpoint)
# validator_base_url: regular TLS API (nonce fetch, LUKS confirm, etc.)
tdx_base_url: "https://tdx-attestation.example.com:8443"
tdx_timeout: 30
tdx_retry_count: 3

# Debug build flag - set to true to skip encryption
# Can be overridden in inventory.yml
debug_build: false