---
- name: Validate checkpoint_img_path is set
  ansible.builtin.assert:
    that: checkpoint_img_path | length > 0
    fail_msg: "checkpoint_img_path must be set when including the save-checkpoint role"

- name: Check if checkpoint image already exists
  ansible.builtin.stat:
    path: "{{ checkpoint_img_path }}"
  register: checkpoint_img_stat

- name: Save checkpoint image
  when: not checkpoint_img_stat.stat.exists or no_cache == 'true'
  block:
    - name: Clean cloud-init state on build VM
      ansible.builtin.command: cloud-init clean --logs
      delegate_to: build-node
      become: true
      changed_when: true

    # virsh suspend pauses vCPUs but does not flush the guest page cache, so anything written in
    # the seconds before it never reaches the virtual disk and is absent from the copy. Observed:
    # a file written 0.9s before the suspend was missing from the captured image, and the
    # cloud-init logs deleted just above were still present in it.
    - name: Flush guest writes to disk before capture
      ansible.builtin.command: sync
      delegate_to: build-node
      become: true
      changed_when: false

    - name: Suspend build VM
      ansible.builtin.command: virsh suspend "{{ vm_name }}"
      changed_when: true

    # copy does not create parent directories, and a fresh checkout has guest-tools/image/ (from
    # its .gitkeep) but not the per-env subdirectory. Only a host with prior builds already has it,
    # so without this the first build on a clean clone fails here — after the VM is suspended.
    - name: Ensure the checkpoint directory exists
      ansible.builtin.file:
        path: "{{ checkpoint_img_path | dirname }}"
        state: directory
        mode: '0755'

    - name: Copy build disk to checkpoint image
      ansible.builtin.copy:
        src: "{{ build_img_path }}"
        dest: "{{ checkpoint_img_path }}"
        remote_src: true
        mode: '0644'

    - name: Resume build VM
      ansible.builtin.command: virsh resume "{{ vm_name }}"
      changed_when: true

    - name: Wait for VM network to recover after resume
      ansible.builtin.wait_for:
        host: "{{ build_vm_ip }}"
        port: 22
        timeout: 60
        delay: 5

    - name: Restore network state in VM after resume
      ansible.builtin.shell: |
        systemctl restart systemd-networkd
        systemctl restart systemd-resolved
      delegate_to: build-node
      become: true
      changed_when: false
