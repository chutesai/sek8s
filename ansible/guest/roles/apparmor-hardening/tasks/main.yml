---
# AppArmor hardening: install profiles, abstractions, systemd drop-ins,
# and a boot-time verification service.

# ── Abstractions (Jinja2 templates for debug_build audit toggle) ──────────

- name: Install sek8s AppArmor abstractions
  ansible.builtin.template:
    src: "abstractions/{{ item }}.j2"
    dest: "/etc/apparmor.d/abstractions/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - sek8s-cache-deny
    - sek8s-secrets-deny

# ── Static profiles ──────────────────────────────────────────────────────

- name: Install sek8s AppArmor profiles
  ansible.builtin.copy:
    src: "profiles/{{ item }}"
    dest: "/etc/apparmor.d/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - sek8s.system-manager
    - sek8s.setup-cache
    - sek8s.deny-sensitive-default

# ── Systemd drop-ins: apply named profiles to services ───────────────────
# system-manager and setup-cache need their own permissive profiles
# (overriding the auto-attached deny-sensitive-default on bash/python).

- name: Create systemd drop-in directories for AppArmor overrides
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - system-manager
    - setup-cache

- name: Apply AppArmor profile to system-manager via systemd
  ansible.builtin.copy:
    content: |
      [Service]
      AppArmorProfile=sek8s.system-manager
    dest: /etc/systemd/system/system-manager.service.d/30-apparmor.conf
    owner: root
    group: root
    mode: '0644'

- name: Apply AppArmor profile to setup-cache via systemd
  ansible.builtin.copy:
    content: |
      [Service]
      AppArmorProfile=sek8s.setup-cache
    dest: /etc/systemd/system/setup-cache.service.d/30-apparmor.conf
    owner: root
    group: root
    mode: '0644'

# ── Boot-time profile verification ──────────────────────────────────────

- name: Install AppArmor profile verification script
  ansible.builtin.copy:
    src: verify-apparmor-profiles.sh
    dest: /usr/local/bin/verify-apparmor-profiles.sh
    owner: root
    group: root
    mode: '0755'

- name: Install AppArmor profile verification service
  ansible.builtin.copy:
    src: verify-apparmor-profiles.service
    dest: /etc/systemd/system/verify-apparmor-profiles.service
    owner: root
    group: root
    mode: '0644'

- name: Enable AppArmor profile verification service
  ansible.builtin.systemd:
    name: verify-apparmor-profiles.service
    enabled: true
    daemon_reload: true
