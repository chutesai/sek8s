# Allow the kubelet's graceful-node-shutdown inhibitor to delay shutdown long
# enough to terminate pods. The kubelet takes a logind "delay" inhibitor lock on
# PrepareForShutdown and releases it once pods are drained; logind only honours
# the delay up to InhibitDelayMaxSec. This must be >= the kubelet's total
# shutdownGracePeriod (30s, see /etc/rancher/k3s/kubelet.conf.d/) or pods get
# killed mid-drain — the very thing graceful shutdown is meant to prevent.
[Login]
InhibitDelayMaxSec=45
