---
# This role just creates the service - cleanup role adds the dependency

- name: Create k3s-pre-start script
  ansible.builtin.copy:
    src: files/k3s-pre-start.sh
    dest: /usr/local/bin/k3s-pre-start.sh
    owner: root
    group: root
    mode: '0755'

- name: Create k3s-pre-start systemd service
  ansible.builtin.copy:
    src: files/k3s-pre-start.service
    dest: /etc/systemd/system/k3s-pre-start.service
    owner: root
    group: root
    mode: '0644'

# DON'T create the dependency file here - cleanup role will add it
# This allows k3s to run normally during the build

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

# Keep service disabled for build, cleanup will enable for first boot
- name: Disable k3s-pre-start service
  ansible.builtin.systemd:
    name: k3s-pre-start
    enabled: no
    state: stopped