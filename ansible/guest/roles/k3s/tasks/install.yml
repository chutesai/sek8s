---
- name: Get k3s installed version
  ansible.builtin.command: k3s --version
  register: k3s_version_output
  changed_when: false
  ignore_errors: true

- name: Set k3s installed version
  when: not ansible_check_mode and k3s_version_output.rc == 0
  ansible.builtin.set_fact:
    installed_k3s_version: "{{ k3s_version_output.stdout_lines[0].split(' ')[2] }}"

# Download and install only if needed
- name: Download artifact only if needed
  when: not ansible_check_mode and (k3s_version_output.rc != 0 or installed_k3s_version is version(k3s_version, '<'))
  block:
    # The installer at the release tag of the pinned binary, not get.k3s.io: that serves
    # whatever script is current (so the files it installs varied between builds), and when it
    # is down every build fails here.
    - name: Download K3s install script
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
        checksum: "sha256:{{ k3s_install_sha256 }}"
        timeout: 120
        dest: /usr/local/bin/k3s-install.sh
        owner: root
        group: root
        mode: "0755"
      register: k3s_install_script
      until: k3s_install_script is succeeded
      retries: 5
      delay: 10

    - name: Download K3s binary for single node
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s-install.sh
          - --write-kubeconfig-mode 600
          - --disable servicelb
          - --disable traefik
      environment:
        INSTALL_K3S_SKIP_START: "true"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      changed_when: true

# The installer checks the binary only against the sha256sum file of the release it downloads
# from, so pin the binary here too. Unconditional (outside the version-gated block above), so a
# binary left from an earlier run is checked as well.
- name: Hash the k3s binary
  when: not ansible_check_mode
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
    checksum_algorithm: sha256
  register: k3s_binary

- name: Refuse a k3s binary other than the pinned build
  when: not ansible_check_mode
  ansible.builtin.assert:
    that: k3s_binary.stat.checksum | default('') == k3s_sha256
    fail_msg: >-
      /usr/local/bin/k3s is {{ k3s_binary.stat.checksum | default('missing') }}, not the pinned
      {{ k3s_sha256 }} for {{ k3s_version }}

# Unconditional (outside the version-gated block above): the script may be left over from an
# earlier run even when this build skipped the download. It is only ever used to install k3s, but
# it lands in /usr/local/bin, which is measured wholesale into RTMR3; nothing needs it at runtime.
- name: Remove the k3s install script (not needed at runtime)
  ansible.builtin.file:
    path: /usr/local/bin/k3s-install.sh
    state: absent

- name: Add K3s autocomplete to user bashrc
  when: ansible_user is defined
  ansible.builtin.lineinfile:
    path: ~{{ ansible_user }}/.bashrc
    regexp: \.\s+<\(k3s completion bash\)
    line: ". <(k3s completion bash)  # Added by k3s-ansible"

- name: Setup optional config file
  when: k3s_server_config_yaml is defined
  block:
    - name: Make config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        mode: "0755"
        state: directory

    - name: Copy config values
      ansible.builtin.copy:
        content: "{{ k3s_server_config_yaml }}"
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
      register: _server_config_result
