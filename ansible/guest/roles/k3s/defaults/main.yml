---
helm_version: v3.20.2 # noqa var-naming[no-role-prefix]
k3s_version: v1.35.4+k3s1
# SHA-256 of each download at the versions above; bump them together. The binary and tarball are
# from the projects' published checksum files; k3s publishes none for install.sh, so that one is
# the script at the k3s_version tag.
helm_sha256: 258e830a9e613c8a7a302d6059b4bb3b9758f2f3e1bb8ea0d707ce10a9a72fea # noqa var-naming[no-role-prefix]
k3s_install_sha256: 8598e002e61d658fed7b7542fc6d2c66d8da6eae69e088830105d2ee1ffb6d91
k3s_sha256: 080498ece50acdaf23fe5d736f41c616e276a89a4e5605a3f274f39b0fcee85b
k3s_server_location: /var/lib/rancher/k3s
# Helm paths for post-start (must match setup_chutes.yml).
# On root volume (VM-version-specific); not on storage so no sync needed.
helm_config_home: /var/lib/chutes/helm-config
helm_cache_home: /var/lib/chutes/helm-cache
helm_data_home: /var/lib/chutes/helm-data
systemd_dir: /etc/systemd/system # noqa var-naming[no-role-prefix]
k3s_api_port: 6443
user_kubectl: true # noqa var-naming[no-role-prefix]
k3s_extra_server_args: ""
k3s_server_config_yaml: |-
  write-kubeconfig-mode: "0600"
  encryption-provider-config: /run/chutes/k3s-encryption-config.yaml
  # Bound terminal-phase pods (Completed/Error and graceful-shutdown tombstones);
  # default is 12500 so on a single node they never get reaped. NOTE: k3s-pre-start.sh
  # regenerates config.yaml at boot and is the authoritative runtime source — keep this
  # in sync with the kube-controller-manager-arg written there.
  kube-controller-manager-arg:
    - "terminated-pod-gc-threshold=50"
  disable:
    - traefik
    - servicelb
