---
# SSH and password hardening applied to all builds (including benchmark).
# For non-benchmark builds, harden-access goes further (removes SSH entirely).
# These tasks ensure the final image is hardened before RTMR3 hashes are
# computed, so the hardened state is what gets measured and attested.

- name: Harden sshd_config (disable password and keyboard-interactive auth)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin prohibit-password' }
    - { regexp: '^#?ChallengeResponseAuthentication', line: 'ChallengeResponseAuthentication no' }
    - { regexp: '^#?KbdInteractiveAuthentication', line: 'KbdInteractiveAuthentication no' }
  when: not (debug_build | default(false))

- name: Lock passwords for all non-system accounts (uid >= 1000)
  ansible.builtin.shell: |
    awk -F: '$3 >= 1000 && $1 != "nobody" {print $1}' /etc/passwd | \
      xargs -r passwd --lock
  changed_when: true
  when: not (debug_build | default(false))

- name: Lock root password
  ansible.builtin.user:
    name: root
    password_lock: true
  when: not (debug_build | default(false))
