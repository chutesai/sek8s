# /etc/systemd/system/nvidia-persistenced.service.d/override.conf
#
# Static, and deliberately so: /etc/systemd/system is RTMR3-measured, so every byte
# under it must come from the image and match the build manifest. 1.4.0 had
# nvidia-persistenced-config.sh generate this drop-in at boot, which added a path the
# manifest did not contain. The boot-time gate only hash-checks paths it already knows,
# so nothing tripped -- but the chain digest moved, and every VM attested a different
# RTMR3 from its second boot onwards.
#
# The only host-dependent part is the persistence flag, which now arrives as NVPD_FLAG
# from an env file under /run (tmpfs, outside the measured set) written by
# nvidia-persistenced-config.service. Both NVSwitch and non-NVSwitch hosts therefore
# measure identical bytes here and share one registered RTMR3.
[Unit]
Requires=nvidia-persistenced-config.service
After=nvidia-persistenced-config.service

[Service]
# Order matters: systemd applies these in sequence, so the env file overrides the
# default when it exists. The default is not a formality -- nvidia-persistenced-config
# carries ConditionPathExists=/dev/nvidia0, and a condition-skipped unit still counts as
# satisfying Requires=, so the env file can legitimately be absent here.
Environment=NVPD_FLAG=--persistence-mode
EnvironmentFile=-/run/nvidia-persistenced-mode.env
ExecStart=
ExecStart=/usr/bin/nvidia-persistenced $NVPD_FLAG --verbose
TimeoutStartSec=300
