---
- name: Remove any stale apt-cacher-ng proxy config
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/01proxy
    state: absent

- name: Update apt sources to use configured mirror
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/ubuntu.sources
    regexp: 'http://archive\.ubuntu\.com/ubuntu'
    replace: "http://{{ apt_mirror }}/ubuntu"
  failed_when: false

- name: Update legacy sources.list if present
  ansible.builtin.replace:
    path: /etc/apt/sources.list
    regexp: 'http://archive\.ubuntu\.com/ubuntu'
    replace: "http://{{ apt_mirror }}/ubuntu"
  failed_when: false

- name: Log configured mirror
  ansible.builtin.debug:
    msg: "apt mirror set to {{ apt_mirror }}"
