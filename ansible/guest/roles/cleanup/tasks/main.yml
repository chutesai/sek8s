---
- name: Guest VM cleanup
  when: inventory_hostname in groups['vm']
  block:
    - name: Chutes orchestration cleanup (non-benchmark builds)
      when: not (benchmark_build | default(false))
      block:
        - name: Cleanup k3s
          ansible.builtin.include_tasks: cleanup-k3s.yml

        - name: Include k3s drop-ins
          ansible.builtin.include_tasks: k3s-drop-ins.yml

        - name: Include system-manager drop-ins
          ansible.builtin.include_tasks: system-manager-drop-ins.yml

        - name: Include admission-controller drop-ins
          ansible.builtin.include_tasks: admission-controller-drop-ins.yml

        - name: Deploy admission webhook manifest
          ansible.builtin.include_tasks: deploy-admission-webhook.yml

        - name: Cleanup attestation service
          ansible.builtin.include_tasks: cleanup-attestation-service.yml

        - name: Cleanup GPU verification service
          ansible.builtin.include_tasks: cleanup-gpu-verify-service.yml

    - name: Cleanup infiniband-config service
      ansible.builtin.include_tasks: cleanup-infiniband-config-service.yml

    - name: Cleanup verify storage service
      ansible.builtin.include_tasks: cleanup-verify-storage-service.yml

    - name: Cleanup cloud-init
      ansible.builtin.include_tasks: cleanup-cloud-init.yml

    - name: Replace SSH keys with partner keys (benchmark builds)
      ansible.builtin.include_tasks: cleanup-benchmark-ssh.yml
      when: benchmark_build | default(false)

    - name: Cleanup system
      ansible.builtin.include_tasks: cleanup-build.yml

- name: Cleanup VM
  ansible.builtin.include_tasks: cleanup-vm.yml
  when: inventory_hostname in groups['host']
