- name: Shutdown VM
  ansible.builtin.command: virsh shutdown "{{ vm_name }}"
  register: shutdown_result
  changed_when: shutdown_result.rc == 0
  failed_when: false

- name: Wait for VM shutdown
  ansible.builtin.shell: virsh list --state-running | grep -q "{{ vm_name }}"
  register: vm_shutdown
  retries: 60
  delay: 5
  until: vm_shutdown.rc != 0
  changed_when: false
  failed_when: vm_shutdown.rc == 0

- name: Undefine build VM from libvirt
  ansible.builtin.command: virsh undefine "{{ vm_name }}"
  register: undefine_result
  changed_when: undefine_result.rc == 0
  failed_when: false

- name: Ensure final image directory exists
  ansible.builtin.file:
    path: "{{ final_img_path | dirname }}"
    state: directory
    mode: '0750'
    owner: root
    group: libvirt-qemu

- name: Move sek8s image to final image
  ansible.builtin.command: mv "{{ build_img_path }}" "{{ final_img_path }}"
  register: move_result
  changed_when: move_result.rc == 0
  failed_when: move_result.rc != 0

- name: Set permissions on final image
  ansible.builtin.file:
    path: "{{ final_img_path }}"
    mode: '0640'
    owner: root
    group: libvirt-qemu

- name: Verify final image
  ansible.builtin.command: qemu-img check "{{ final_img_path }}"
  register: verify_result
  changed_when: false
  failed_when: verify_result.rc != 0

- name: Output final image path
  ansible.builtin.debug:
    msg: "TDX guest image created at {{ final_img_path }}"
