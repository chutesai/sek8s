---
# tdx-measure — Provision the virtee/tdx-measure fork binary on the build host.
#
# compute-rtmr0/rtmr1-2 need the fork's CLI. This role clones the fork and always
# fast-forwards it to `tdx_measure_ref` from origin — so a build host never silently
# rebuilds a stale binary when the pinned branch moves — then builds it with cargo and
# sets the `tdx_measure_bin` fact. Runs in user space (invoke with become: false): rust
# toolchains and the build tree are per-user.
#
# To iterate on a local tdx-measure, set `tdx_measure_bin` to your own build — the whole
# provision block (clone/update + build) is skipped. Cloning the (private) fork needs git
# credentials; the default src dir is a sibling checkout of this repo.

- name: Provision tdx-measure from source (skipped when tdx_measure_bin is preset)
  when: (tdx_measure_bin | default('')) | length == 0
  # The clone + cargo build run in user space (per-user rust toolchain / build tree);
  # the apt installs below opt back into root per-task.
  become: false
  block:
    # This role is invoked become: false (the build tree is per-user), so the apt
    # installs opt back into root per-task. git clones the fork; cargo builds it.
    - name: Ensure git is installed
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true
      become: true

    # Detect cargo as the build user (respect an existing rustup toolchain in
    # ~/.cargo/bin) and only apt-install if truly absent — never clobber a newer
    # rustup cargo with the older apt one.
    - name: Detect cargo on the build user's PATH
      ansible.builtin.command: which cargo
      register: _tdxm_cargo
      changed_when: false
      failed_when: false

    - name: Install a cargo toolchain when the build user has none
      ansible.builtin.apt:
        name: cargo
        state: present
      become: true
      when: _tdxm_cargo.rc != 0

    - name: Clone the tdx-measure fork if not already checked out
      # update: false — never disturb an existing checkout (a dev's working tree
      # may have local changes); only clone when the dir is missing.
      ansible.builtin.git:
        repo: "{{ tdx_measure_repo_url }}"
        dest: "{{ tdx_measure_src_dir }}"
        version: "{{ tdx_measure_ref }}"
        update: false

    - name: Build the tdx-measure CLI (release)
      ansible.builtin.command:
        cmd: cargo build --release
        chdir: "{{ tdx_measure_src_dir }}/cli"
      changed_when: true

    - name: Point tdx_measure_bin at the freshly built binary
      ansible.builtin.set_fact:
        tdx_measure_bin: "{{ tdx_measure_src_dir }}/cli/target/release/tdx-measure"

- name: Report the tdx-measure binary in use
  ansible.builtin.debug:
    msg: "tdx-measure: {{ tdx_measure_bin | default('tdx-measure (PATH)') }}"
