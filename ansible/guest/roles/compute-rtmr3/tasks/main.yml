---
# compute-rtmr3 — Compute expected RTMR3 from the finalized qcow2 image.
#
# Runs on the host after finalize-vm-image and before the luks/prime-vm steps.
# Mounts the image read-only via guestmount and simulates the exact SHA-384
# extension chain that the rtmr3-measure initramfs script runs at boot.
#
# Output: <final_img_path without extension>.rtmr3  (bare uppercase hex)
# The per-file hash detail is emitted to the Ansible debug task for the build log.
#
# Prerequisite on the build host: sudo apt install libguestfs-tools

- name: Check guestmount is available
  ansible.builtin.command: which guestmount
  changed_when: false
  register: guestmount_check
  failed_when: guestmount_check.rc != 0

- name: Run compute-rtmr3.sh against final image
  ansible.builtin.command: >-
    {{ repo_root }}/guest-tools/scripts/compute-rtmr3.sh {{ final_img_path }}
  register: rtmr3_compute
  changed_when: false

- name: Show RTMR3 computation output
  ansible.builtin.debug:
    msg: "{{ rtmr3_compute.stderr_lines }}"

- name: Show RTMR3 output file location
  ansible.builtin.debug:
    msg: "RTMR3 written to {{ final_img_path | splitext | first }}.rtmr3"
