---
# compute-rtmr3 — Compute expected RTMR3 from the finalized qcow2 image.
#
# Runs on the host after finalize-vm-image and before the luks/prime-vm steps.
# Mounts the image read-only via guestmount and simulates the exact SHA-384
# extension chain that the rtmr3-measure initramfs script runs at boot.
#
# Output: <final_img_path without extension>.rtmr3  (bare uppercase hex)
# The per-file hash detail is emitted to the Ansible debug task for the build log.
#
# RTMR3 is derived from userspace files only, so it is luks-independent and computed
# pre-luks against the plaintext image (guestmount reads it directly, no passphrase).

- name: Ensure guestmount is installed
  ansible.builtin.apt:
    name: libguestfs-tools
    state: present
    update_cache: true

- name: Check guestmount is available
  ansible.builtin.command: which guestmount
  changed_when: false
  register: guestmount_check
  failed_when: guestmount_check.rc != 0

# compute-rtmr3 normally runs PRE-luks against the plaintext root. But a re-run of
# `--tags compute-measurements` lands on an image a prior full build already encrypted,
# where there is no plaintext ext4 root to guestmount. RTMR3 is content-derived and was
# already computed (pre-luks) by the run that built THIS image, so instead of failing we
# detect the encrypted root and reuse the value recorded in that version's measurement.
- name: Detect whether the finalized image root is already LUKS-encrypted
  ansible.builtin.command: "virt-filesystems --long --all -a {{ final_img_path }}"
  register: _rtmr3_vfs
  changed_when: false

- name: Compute RTMR3 from the plaintext image (normal pre-luks path)
  when: "'crypto_LUKS' not in _rtmr3_vfs.stdout"
  block:
    - name: Run compute-rtmr3.sh against final image
      ansible.builtin.command: >-
        {{ role_path }}/files/compute-rtmr3.sh {{ final_img_path }}
      register: rtmr3_compute
      changed_when: false

    - name: Register RTMR3 as a build fact (no on-disk artifact)
      ansible.builtin.set_fact:
        rtmr3: "{{ rtmr3_compute.stdout | trim }}"

- name: Reuse RTMR3 from the version's existing measurement (root already LUKS)
  when: "'crypto_LUKS' in _rtmr3_vfs.stdout"
  block:
    - name: Locate the existing measurements artifact for this version
      ansible.builtin.stat:
        path: "{{ repo_root }}/measurements/{{ vm_version }}/measurements.yaml"
      register: _rtmr3_meas_stat

    - name: Fail when the image is encrypted and no prior RTMR3 exists to reuse
      ansible.builtin.fail:
        msg: >-
          {{ final_img_path }} has a LUKS-encrypted root, so RTMR3 cannot be recomputed
          from its plaintext, and measurements/{{ vm_version }}/measurements.yaml does not
          exist to reuse a prior value. Run this against the plaintext image before luks
          (a fresh full build) so RTMR3 is measured, then re-run.
      when: not _rtmr3_meas_stat.stat.exists

    - name: Read the existing measurements (on the build host)
      ansible.builtin.slurp:
        src: "{{ repo_root }}/measurements/{{ vm_version }}/measurements.yaml"
      register: _rtmr3_meas_raw

    - name: Reuse the recorded runtime_rtmr3 for this version
      ansible.builtin.set_fact:
        # The file is version-scoped (one measurements entry), so [0] is this version.
        rtmr3: "{{ (_rtmr3_meas_raw.content | b64decode | from_yaml).measurements[0].runtime_rtmr3 }}"

    - name: Note the reuse
      ansible.builtin.debug:
        msg: "RTMR3 reused from existing measurement (root already LUKS-encrypted)."

- name: Show RTMR3
  ansible.builtin.debug:
    msg: "RTMR3={{ rtmr3 }}"
