---
# setup-ssh-access — Configure authorised SSH keys for the final image.
#
# Removes the builder's authorized_keys (installed by cloud-init during the
# image build) and writes only the intended access key(s) so that only the
# authorised recipient can connect.  Also verifies the final key set exactly
# matches guest_ssh_keys.
#
# Only included by tee-gpu-vm.yml — the playbook decides whether to include
# this role.  Must run after rtmr3-measure (session-specific keys are measured
# but not pre-verified) and before seal-vm.
#
# Idempotent: safe to re-run. No flags or conditionals.

- name: Remove builder authorized_keys (cloud-init residual)
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent

- name: Ensure /root/.ssh directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Write guest SSH keys to authorized_keys
  ansible.builtin.copy:
    dest: /root/.ssh/authorized_keys
    content: "{{ guest_ssh_keys | join('\n') }}\n"
    owner: root
    group: root
    mode: '0600'



- name: Read back authorized_keys for verification
  ansible.builtin.slurp:
    src: /root/.ssh/authorized_keys
  register: authorized_keys_content

- name: Verify authorized_keys contains exactly the expected keys
  ansible.builtin.assert:
    that:
      - item in (authorized_keys_content.content | b64decode)
    fail_msg: >-
      SSH key verification failed: expected key not found in /root/.ssh/authorized_keys.
      Build halted to prevent shipping image with incorrect keys.
    success_msg: "SSH key verified: {{ item[:40] }}..."
  loop: "{{ guest_ssh_keys }}"

- name: Verify no unexpected keys in authorized_keys
  ansible.builtin.assert:
    that:
      - (authorized_keys_content.content | b64decode).split('\n') | select('match', '^ssh-') | list | length == guest_ssh_keys | length
    fail_msg: >-
      SSH key count mismatch: authorized_keys contains a different number of keys than
      guest_ssh_keys. Build halted — image may contain unexpected keys.
    success_msg: "authorized_keys key count matches guest_ssh_keys ({{ guest_ssh_keys | length }} key(s))"
