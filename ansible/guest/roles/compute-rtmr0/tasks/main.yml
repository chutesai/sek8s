---
# compute-rtmr0 — generate the per-topology RTMR0 measurements (post-luks).
#
# Peer of compute-rtmr1-2 (RTMR1/2) and compute-rtmr3 (RTMR3). For each supported
# topology it runs the tdx-measure fork, which now self-generates the COMPLETE
# 15-event RTMR0 (firmware + QEMU-generated ACPI + fw_cfg + SMBIOS) — no captured
# baseline CCEL, no splice. See guest-tools/measurement/generate_measurements.py.
#
# measurement_profile:
#   - a name (e.g. RTX_PRO_6000) → generate just that profile (debug-VM case).
#   - empty → generate ALL profiles (prod publish).
#
# Fully OFFLINE — the fork + Docker (with buildx; it uses `docker build --progress
# plain`) on ANY x86-64 Linux (no TDX, no GPUs). Determinism across generating hosts
# comes from the profile's captured CPU identity (vendor/phys-bits/processor_id),
# reconstructed into the measurement -cpu; a non-matching host still reproduces the
# production RTMR0. Non-fatal: a profile that can't be generated (e.g. no
# passthrough["gpu"] modeled, or missing CPU identity) is listed PENDING, not fatal.

- name: Generate per-topology RTMR0 (self-contained — no baseline CCEL)
  ansible.builtin.command:
    argv:
      - python3
      - "{{ repo_root }}/guest-tools/measurement/generate_measurements.py"
      - generate
      - --profile
      - "{{ measurement_profile | default('') }}"
      - --version
      - "{{ vm_version }}"
      - --output
      - "/tmp/rtmr0-{{ vm_version }}.json"
      - --tdx-measure-bin
      - "{{ tdx_measure_bin | default('tdx-measure') }}"
  environment:
    # The tdx-measure fork shells out to `docker build` for offline ACPI generation
    # (Command::new("docker") in acpi.rs). Extend PATH so the fork subprocess finds
    # docker even when it is installed via snap (/snap/bin) or the task inherits a
    # minimal PATH — otherwise it fails with "Failed to invoke `docker build`" (ENOENT).
    PATH: "{{ lookup('env', 'PATH') }}:/usr/local/bin:/usr/bin:/snap/bin"
  register: _rtmr0_gen
  changed_when: _rtmr0_gen.rc == 0
  failed_when: false

- name: Show RTMR0 generation output
  ansible.builtin.debug:
    var: _rtmr0_gen.stderr_lines

- name: Register RTMR0 measurements as a build fact (from the transient JSON)
  ansible.builtin.set_fact:
    rtmr0_data: "{{ lookup('file', '/tmp/rtmr0-' + vm_version + '.json') | from_json }}"
  when: _rtmr0_gen.rc == 0

- name: Remove the transient RTMR0 JSON (the fact holds it now — no persisted artifact)
  ansible.builtin.file:
    path: "/tmp/rtmr0-{{ vm_version }}.json"
    state: absent

- name: Note RTMR0 generation failed (non-fatal)
  ansible.builtin.debug:
    msg: >-
      RTMR0 generation returned {{ _rtmr0_gen.rc }} — see the output above. The
      aggregate step will warn about the missing fact and the tags to re-run.
  when: _rtmr0_gen.rc != 0
