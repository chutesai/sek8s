---
# Drop vestigial cloud-image machinery from the initramfs before it is built.
#
# The initramfs is measured into RTMR2, so anything inside it that varies between builds makes the
# image non-reproducible and defeats the third-party verification inventory-reproduce.yml
# documents. Two cloud-image features that sek8s does not use were doing exactly that:
#
#   overlayroot  writes a fresh /.random-seed into every initramfs. It also installs an
#                init-bottom script that can mount an overlay over the root filesystem, and it
#                sorts BEFORE rtmr3-measure — an unused root-remount mechanism sitting in the
#                measured boot path ahead of the thing that measures the root. sek8s uses a
#                LUKS-encrypted writable root and never an overlay.
#   mdadm        bakes a generation timestamp into mdadm.conf. RAID is a HOST concern here
#                (ansible/host/playbooks/storage-setup.yml builds md0 across the large disks); the
#                guest is handed individual virtio-blk devices and never sees an array.
#   copymods     mounts a tmpfs over $rootmnt/lib/modules. No-ops here (exits early when the root
#                already has modules for the running kernel) and reads only RTMR2-covered inputs,
#                so this is dead weight rather than exposure — but it is another unused mount
#                primitive sorting ahead of rtmr3-measure.
#   dyn-netconf  writes a BOOTIF interface file into /run. Guest networking is static; unused.
#
# Hooks not packages: all four are ubuntu-server `Depends:`, so purging them would drag
# ubuntu-server and let cleanup-cloud-init's autoremove sweep lvm2, multipath-tools and friends.
# Durable because this runs immediately before the final update-initramfs — no apt operation
# follows it. Note purging cloud-init removes none of these: they come from the unrelated
# `cloud-initramfs-tools` source package.
- name: Remove unused cloud-image initramfs hooks (per-build variability in a measured artifact)
  ansible.builtin.shell: |
    set -euo pipefail
    root="{{ newroot_mount }}"
    root="${root%/}"
    removed=0
    for name in overlayroot mdadm copymods cloud-initramfs-dyn-netconf; do
      while IFS= read -r f; do
        rm -f "$f"
        echo "removed $f"
        removed=$((removed + 1))
      done < <(find "$root/usr/share/initramfs-tools" "$root/etc/initramfs-tools" \
                    -type f -name "$name" 2>/dev/null)
    done
    echo "total removed: $removed"
  args:
    executable: /bin/bash
  register: _initramfs_hook_removal
  changed_when: true

- name: Show which initramfs hooks were removed
  ansible.builtin.debug:
    var: _initramfs_hook_removal.stdout_lines

# The hook removal above leaves overlayroot's config on the rootfs. No package ships
# /etc/overlayroot.local.conf (only /etc/overlayroot.conf, by `overlayroot`); the cloud image
# creates it setting `overlayroot_cfgdisk=LABEL=OROOTCFG`. Config precedence in the init-bottom
# script is 20-root-config < 30-root-local-config < 80-cfgdisk, so that setting lets a disk the
# HOST attaches outrank both on-root configs and enable an overlay, without touching the cmdline
# (RTMR2) or the LUKS root. /etc/overlayroot.conf stays: it is a dpkg conffile and it is what
# asserts cfgdisk="disabled". Both paths are measured, so a reappearance fails the boot gate.
- name: Remove the overlayroot config disk override (host-attachable config source)
  ansible.builtin.file:
    path: "{{ newroot_mount }}/etc/overlayroot.local.conf"
    state: absent
