---
# Admission-controller TLS material is regenerated fresh per-VM at BOOT
# (generate-admission-cert) and NONE of it survives into the sealed image, so
# none of it is measured into RTMR3.
#
# The CA + server cert generated here are BUILD-TIME THROWAWAYS: the build starts
# the admission controller to validate readiness (configure-admission-service.yml
# waits on https://localhost:8443/health), which needs a server cert to bind TLS.
# These files are stripped before the image is sealed by
# cleanup-orchestration/tasks/cleanup-admission-certs.yml, so the audited image
# ships no CA private key and RTMR3 stays reproducible across rebuilds.
#
# The webhook caBundle is NOT derived from this CA — the manifests bake a
# deterministic placeholder (__ADMISSION_CA_BUNDLE__) and the real per-VM CA is
# injected at boot. See cleanup-orchestration/templates/*-webhook.yaml.j2 and
# files/generate-admission-cert.sh.
- name: Setup admission-controller TLS material (build-time throwaway)
  block:
    - name: Ensure certs directory exists
      ansible.builtin.file:
        path: /etc/admission-controller/certs
        state: directory
        owner: root
        group: admission
        mode: '0750'

    - name: Generate build-time CA private key
      ansible.builtin.command:
        cmd: >-
          openssl genrsa -out /etc/admission-controller/certs/ca.key 4096
        creates: /etc/admission-controller/certs/ca.key

    - name: Generate build-time CA certificate (self-signed)
      ansible.builtin.command:
        cmd: >-
          openssl req -new -x509
          -key /etc/admission-controller/certs/ca.key
          -out /etc/admission-controller/certs/ca.crt
          -days 3650
          -subj "/CN=admission-controller-ca"
        creates: /etc/admission-controller/certs/ca.crt

    - name: Create OpenSSL config for server certificate with SANs
      ansible.builtin.copy:
        content: |
          [req]
          distinguished_name = req_distinguished_name
          req_extensions = v3_req
          prompt = no

          [req_distinguished_name]
          CN = admission-controller

          [v3_req]
          keyUsage = keyEncipherment, dataEncipherment
          extendedKeyUsage = serverAuth
          subjectAltName = @alt_names

          [alt_names]
          DNS.1 = admission-controller
          DNS.2 = admission-controller.kube-system.svc
          DNS.3 = admission-controller.kube-system.svc.cluster.local
          DNS.4 = localhost
          IP.1 = 127.0.0.1
          IP.2 = ::1
        dest: /etc/admission-controller/certs/openssl.cnf
        owner: root
        group: root
        mode: '0644'

    - name: Generate build-time server private key
      ansible.builtin.command:
        cmd: openssl genrsa -out /etc/admission-controller/certs/server.key 4096
        creates: /etc/admission-controller/certs/server.key

    - name: Generate build-time server CSR
      ansible.builtin.command:
        cmd: >-
          openssl req -new
          -key /etc/admission-controller/certs/server.key
          -out /etc/admission-controller/certs/server.csr
          -config /etc/admission-controller/certs/openssl.cnf
        creates: /etc/admission-controller/certs/server.csr

    - name: Generate build-time server certificate (CA-signed)
      ansible.builtin.command:
        cmd: >-
          openssl x509 -req -days 365
          -in /etc/admission-controller/certs/server.csr
          -CA /etc/admission-controller/certs/ca.crt
          -CAkey /etc/admission-controller/certs/ca.key
          -CAcreateserial
          -out /etc/admission-controller/certs/server.crt
          -extensions v3_req
          -extfile /etc/admission-controller/certs/openssl.cnf
        creates: /etc/admission-controller/certs/server.crt

    - name: Remove CSR (not needed at runtime)
      ansible.builtin.file:
        path: /etc/admission-controller/certs/server.csr
        state: absent

    - name: Set certificate permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/admission-controller/certs/ca.key, mode: '0600', group: 'root' }
        - { path: /etc/admission-controller/certs/ca.crt, mode: '0644', group: 'root' }
        - { path: /etc/admission-controller/certs/server.key, mode: '0640', group: 'admission' }
        - { path: /etc/admission-controller/certs/server.crt, mode: '0644', group: 'root' }
