---
# Admission-controller TLS material is generated entirely at BOOT, never at
# build time, so that none of it is baked into the measured root image.
#
# Why: the admission CA must be ephemeral per-VM (a third party builds the image
# and audits its RTMR3 measurements, so we cannot ship a CA private key, and a
# build-time CA would also make RTMR3 drift on every rebuild). generate-admission-cert
# mints a fresh CA + server cert on every boot and injects the matching caBundle
# into the webhook manifests after rtmr3-verify has confirmed the placeholder
# manifests match the measurement. See:
#   - files/generate-admission-cert.sh
#   - cleanup-orchestration/templates/{validating,mutation}-webhook.yaml.j2 (placeholder caBundle)
#
# The only thing baked here is the OpenSSL config (server cert SANs) — static,
# deterministic, and intentionally NOT measured.
- name: Setup admission-controller TLS config
  block:
    - name: Ensure certs directory exists
      ansible.builtin.file:
        path: /etc/admission-controller/certs
        state: directory
        owner: root
        group: admission
        mode: '0750'

    - name: Create OpenSSL config for server certificate with SANs
      ansible.builtin.copy:
        content: |
          [req]
          distinguished_name = req_distinguished_name
          req_extensions = v3_req
          prompt = no

          [req_distinguished_name]
          CN = admission-controller

          [v3_req]
          keyUsage = keyEncipherment, dataEncipherment
          extendedKeyUsage = serverAuth
          subjectAltName = @alt_names

          [alt_names]
          DNS.1 = admission-controller
          DNS.2 = admission-controller.kube-system.svc
          DNS.3 = admission-controller.kube-system.svc.cluster.local
          DNS.4 = localhost
          IP.1 = 127.0.0.1
          IP.2 = ::1
        dest: /etc/admission-controller/certs/openssl.cnf
        owner: root
        group: root
        mode: '0644'
