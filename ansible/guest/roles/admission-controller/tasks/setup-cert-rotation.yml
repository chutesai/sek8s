---
# Installs generate-admission-cert.service, which runs every boot to mint a fresh
# ephemeral per-VM CA + server certificate and inject the matching caBundle into
# the webhook manifests. Nothing is baked into the measured root image. Runs
# After=rtmr3-verify (RTMR3 verified against the placeholder manifests) and
# Before=k3s (inject before k3s applies the webhook).

- name: Install generate-admission-cert script
  ansible.builtin.copy:
    src: generate-admission-cert.sh
    dest: /usr/local/bin/generate-admission-cert
    owner: root
    group: root
    mode: '0755'

- name: Install generate-admission-cert systemd service
  ansible.builtin.copy:
    src: generate-admission-cert.service
    dest: /etc/systemd/system/generate-admission-cert.service
    owner: root
    group: root
    mode: '0644'

- name: Enable generate-admission-cert service
  ansible.builtin.systemd:
    name: generate-admission-cert
    enabled: yes
    daemon_reload: yes
