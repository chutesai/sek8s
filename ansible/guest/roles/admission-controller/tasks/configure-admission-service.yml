---
- name: Configure admission controller service
  block:
    - name: Create admission controller systemd service
      ansible.builtin.copy:
        src: admission-controller.service
        dest: /etc/systemd/system/admission-controller.service
        owner: root
        group: root
        mode: '0644'

    - name: Create admission controller service override directory
      ansible.builtin.file:
        path: /etc/systemd/system/admission-controller.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create security hardening drop-in
      ansible.builtin.copy:
        src: admission-controller.conf
        dest: /etc/systemd/system/admission-controller.service.d/10-security.conf
        owner: root
        group: root
        mode: '0644'

    - name: Deploy DOCKER_CONFIG drop-in (shared path with system-manager)
      ansible.builtin.copy:
        src: 20-docker-config.conf
        dest: /etc/systemd/system/admission-controller.service.d/20-docker-config.conf
        owner: root
        group: root
        mode: '0644'

    - name: Grant registry mTLS leaf access via drop-in (cosign --registry-client-cert)
      ansible.builtin.copy:
        src: 40-registry-tls.conf
        dest: /etc/systemd/system/admission-controller.service.d/40-registry-tls.conf
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd and start admission controller
      ansible.builtin.systemd:
        name: admission-controller
        daemon_reload: yes
        
        enabled: yes
        state: started

    - name: Wait for admission controller to be ready
      ansible.builtin.uri:
        url: https://localhost:8443/health
        validate_certs: no
        status_code: 200
      register: admission_health
      until: admission_health.status == 200
      retries: 30
      delay: 2