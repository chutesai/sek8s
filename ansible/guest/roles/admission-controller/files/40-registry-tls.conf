[Service]
# cosign presents the registry mTLS leaf to registry.chutes.ai via
# --registry-client-cert. Group-read on the root-owned leaf is gated by the
# shared registry-tls group; /run/chutes is 0755 so no bind mount is needed.
# Appends to SupplementaryGroups (10-security resets it, 30-signing-keys adds
# chutes-keys); ordered last so both appends survive.
SupplementaryGroups=registry-tls
