# /etc/tdx-measure.conf — RTMR3 measurement path list (chutes-miner-vm)
#
# THIS FILE IS INTENTIONALLY STATIC.  The paths listed here are hardcoded in
# the role source (files/tdx-measure-miner.conf) and are NOT driven by Ansible
# variables so that they cannot be silently changed by inventory overrides.
# Third parties can reproduce the exact RTMR3 measurement chain by reading
# this file in the repository.
#
# This file is baked into the initramfs (covered by RTMR1) so the list of
# measured paths cannot be tampered with without changing RTMR1.
#
# Each non-blank, non-comment line names a file or directory to measure into
# TDX RTMR3 at boot.  Directories are walked recursively; all entries are
# sorted lexicographically before hashing to guarantee a deterministic extend
# chain regardless of filesystem ordering.
#
# Only regular files are measured.  Symlinks, sockets, pipes, and device nodes
# are skipped.  Missing paths contribute nothing to RTMR3.
#
# verify-access-config is intentionally absent from this image (not installed
# on chutes-miner-vm).  Use files/tdx-measure-gpu.conf for tee-gpu-vm.

# System access-control files
/etc/ssh
/etc/pam.d
/etc/passwd
/etc/shadow
/etc/sudoers
/etc/sudoers.d
/etc/default/grub
/root/.ssh

# PAM/auth-adjacent configs — prevent NSS redirection, login policy, shell tampering
/etc/nsswitch.conf
/etc/login.defs
/etc/shells
/etc/security

# Seccomp profiles — runtime syscall enforcement for k3s workloads
/var/lib/kubelet/seccomp

# rtmr3-verify environment file — must not exist on production builds.
# Defense-in-depth only: even if debug mode were enabled, the validator's
# RTMR3 check at attestation time is authoritative. Bypassing rtmr3-verify
# just delays the inevitable rejection — no workloads would deploy.
/etc/default/rtmr3-verify

# Post-bind-mount RTMR3 integrity check
/usr/local/bin/rtmr3-verify

# sek8s application source — installed at image build time
/opt/sek8s/src

# OPA admission-controller policies — installed at image build time
/etc/opa/policies

# k3s post-start runner and per-step scripts — installed at image build time
/usr/local/bin/k3s-post-start.sh
/usr/local/bin/k3s-init-scripts

# Path-restricted privileged remove wrapper — the system-manager sudoers grant
# points at this (instead of bare /usr/bin/rm). Measuring it ensures the binary
# that runs as root cannot be swapped on the root image without changing RTMR3.
/usr/local/bin/cache-rm

# Helm chart reconcile specs — the single source of truth for boot-time chart
# reconciliation (04-helm-chart-upgrade.sh). Measuring these ensures the pinned
# chart versions, values, and flags cannot be tampered with on the root image.
/etc/chutes/charts

# Storage bind-mount setup script — syncs root manifests into storage (rsync -ac).
# Measuring this script ensures any tamper to the sync logic is detectable.
/usr/local/bin/setup-storage-bind-mounts.sh

# k3s static manifests (source, on root filesystem).
# After boot, /var/lib/rancher/k3s/server/manifests is bind-mounted from storage.
# rsync -ac syncs root→storage unconditionally on every boot.  The watchdog
# verifies the storage copy matches the root measurement by recomputing the chain
# from the live (bind-mounted) path and comparing to hardware RTMR3.
#
# The webhook manifests bake a deterministic `caBundle: __ADMISSION_CA_BUNDLE__`
# placeholder so this measurement is reproducible across builds.  The real
# (ephemeral, per-VM) CA is substituted into the *storage* copy at boot by
# generate-admission-cert AFTER rtmr3-verify has confirmed the placeholder copy
# still matches this measurement — so the live caBundle is never measured.
/var/lib/rancher/k3s/server/manifests

# NOTE: /etc/admission-controller/certs is intentionally NOT measured.  The CA
# key/cert and the per-VM server cert are all generated fresh at boot (ephemeral,
# never written to the root image) so a third party can reproduce this RTMR3
# chain without access to any private key material.  See generate-admission-cert.
