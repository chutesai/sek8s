[Unit]
# Hard dependency: k3s must not start if rtmr3-verify has not confirmed that
# the live filesystem (including storage bind-mounts) matches the hardware
# RTMR3 extended at init-bottom.  rtmr3-verify powers off the VM on any
# mismatch, so this Requires= is defence-in-depth — it structurally blocks k3s
# even if the poweroff path somehow fails to execute.
Requires=rtmr3-verify.service
After=rtmr3-verify.service
