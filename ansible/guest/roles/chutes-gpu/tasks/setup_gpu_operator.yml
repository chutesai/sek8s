---
# Helm config dirs are also created by setup_chutes.yml, but GPU operator runs first
# so we create them here too (idempotent).
- name: Create Helm config directories for GPU operator build-time use
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ helm_config_home }}"
    - "{{ helm_cache_home }}"
    - "{{ helm_data_home }}"

- name: Add NVIDIA Helm repository to pre-configured Helm paths
  ansible.builtin.shell: |
    helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
    helm repo update
  environment:
    HELM_CONFIG_HOME: "{{ helm_config_home }}"
    HELM_CACHE_HOME: "{{ helm_cache_home }}"
    HELM_DATA_HOME: "{{ helm_data_home }}"
  args:
    executable: /bin/bash

- name: Create chart values directory
  ansible.builtin.file:
    path: /etc/chutes/charts/values
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install GPU operator values file
  ansible.builtin.copy:
    src: charts/values/gpu-operator.yaml
    dest: /etc/chutes/charts/values/gpu-operator.yaml
    owner: root
    group: root
    mode: '0644'

# Build-time install uses the same values file as the boot-time reconcile (single
# source of truth). --disable-openapi-validation is NOT needed here (fresh install,
# no CRD migration) — it only applies to cross-version upgrades on persisted nodes.
- name: Install GPU Operator
  ansible.builtin.command: >
    helm upgrade --install gpu-operator nvidia/gpu-operator
    --namespace gpu-operator
    --version {{ gpu_operator_chart_version }}
    --values /etc/chutes/charts/values/gpu-operator.yaml
    --create-namespace
    --kubeconfig=/etc/rancher/k3s/k3s.yaml
  environment:
    HELM_CONFIG_HOME: "{{ helm_config_home }}"
    HELM_CACHE_HOME: "{{ helm_cache_home }}"
    HELM_DATA_HOME: "{{ helm_data_home }}"
  register: helm_result
  changed_when: helm_result.rc == 0

- name: Ensure chart specs directory exists
  ansible.builtin.file:
    path: /etc/chutes/charts
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: helm_result.rc == 0

# Single source of truth for the GPU operator, reconciled at boot by
# 04-helm-chart-upgrade.sh and measured into RTMR3. Replaces the old
# chart-versions marker + chart-configs entry + chart-upgrade-overrides script.
- name: Install GPU operator chart spec
  ansible.builtin.template:
    src: charts/gpu-operator.conf.j2
    dest: /etc/chutes/charts/gpu-operator.conf
    owner: root
    group: root
    mode: '0644'
  when: helm_result.rc == 0
