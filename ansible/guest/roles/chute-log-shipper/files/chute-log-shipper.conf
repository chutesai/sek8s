[Service]
# Hardened, capability-free service: it only reads log files + the CRI socket
# and makes outbound mTLS calls. No sudo, no privileged helpers.
PrivateTmp=true
ProtectSystem=full
ProtectHome=true
# Only the cursor dir is writable; StateDirectory grants this too, listed for clarity.
ReadWritePaths=/var/lib/chute-log-shipper
# Read-only sources (leading '-' tolerates absence before k3s/initramfs create them).
ReadOnlyPaths=-/run/k3s/containerd -/var/log/pods -/run/chutes/registry-tls
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectClock=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=true
LockPersonality=true
MemoryDenyWriteExecute=true
RestrictRealtime=true
RemoveIPC=true
PrivateDevices=true
NoNewPrivileges=true
# The long-running process needs no capabilities at all.
CapabilityBoundingSet=
AmbientCapabilities=
TasksMax=256
LimitNOFILE=8192
