[Service]
# Hardened, capability-free service: it only reads log files + the CRI socket
# and makes outbound mTLS calls. No sudo, no privileged helpers.
PrivateTmp=true
ProtectSystem=full
ProtectHome=true
# Only the cursor dir is writable; StateDirectory grants this too, listed for clarity.
ReadWritePaths=/var/lib/chute-log-shipper
# Read-only sources (leading '-' tolerates absence before k3s/initramfs create them).
ReadOnlyPaths=-/run/k3s/containerd -/var/log/pods -/run/chutes/registry-tls
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectClock=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=true
LockPersonality=true
MemoryDenyWriteExecute=true
RestrictRealtime=true
RemoveIPC=true
PrivateDevices=true
NoNewPrivileges=true
# Chute pod logs under /var/log/pods are created root:root by kubelet with hardened
# perms (0750 dirs / 0640 files), so the non-root shipper can neither traverse nor read
# them. CAP_DAC_READ_SEARCH grants read+traverse DAC bypass only — no write, no broad root.
# In enforce mode the AppArmor profile bounds the cap to the paths it allows (chutes_* pod
# logs + the shipper's own dirs), so it cannot reach system secrets; the kernel's ptrace
# gate still protects other processes' /proc/<pid> data from a DAC-only bypass.
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
AmbientCapabilities=CAP_DAC_READ_SEARCH
TasksMax=256
LimitNOFILE=8192
