[Service]
# Hardened service: it reads log files, reaches the CRI socket only through the
# crictl child profile, and makes outbound mTLS calls. No sudo.
PrivateTmp=true
ProtectSystem=full
ProtectHome=true
# Only the cursor dir is writable; StateDirectory grants this too, listed for clarity.
ReadWritePaths=/var/lib/chute-log-shipper
# Read-only sources (leading '-' tolerates absence before k3s/initramfs create them).
ReadOnlyPaths=-/run/k3s/containerd -/var/log/pods
# Shadow 0700 /run/chutes with a private tmpfs holding only the mTLS leaf. A bind alone
# cannot cross the 0700 parent. mode is explicit: tmpfs defaults to 1777.
TemporaryFileSystem=/run/chutes:ro,mode=0755
BindReadOnlyPaths=-/run/chutes/registry-tls
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectClock=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=true
LockPersonality=true
MemoryDenyWriteExecute=true
RestrictRealtime=true
RemoveIPC=true
PrivateDevices=true
# false: `crictl-pods-helper cx -> crictl` is an LSM domain transition, which the kernel
# refuses under no_new_privs -- the exec fails EACCES and discovery dies (only visible on an
# enforcing build). AppArmor is the binding constraint instead: no ux/Ux rule, and every
# permitted exec is mrix or the one cx into a narrower child, none of them setuid.
NoNewPrivileges=false
# Chute pod logs under /var/log/pods are created root:root by kubelet with hardened
# perms (0750 dirs / 0640 files), so the non-root shipper can neither traverse nor read
# them. CAP_DAC_READ_SEARCH grants read+traverse DAC bypass only — no write, no broad root.
# AppArmor bounds where that bypass applies, but wider than the pod logs: the profile also
# allows /proc, /sys, /usr/lib and /opt/sek8s, so root-only files there are readable too.
# Key material stays out of reach because /etc is granted narrowly (only
# /etc/chute-log-shipper plus ld.so and nameservice), and the kernel's ptrace gate still
# protects other processes' /proc/<pid> data — CAP_SYS_PTRACE is not in the bounding set.
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
AmbientCapabilities=CAP_DAC_READ_SEARCH
TasksMax=256
LimitNOFILE=8192
