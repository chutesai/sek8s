---
# Boot a build VM from an image that is already present and ready.
#
# Pure lifecycle: pick the starting image, copy it into libvirt storage, define/start the domain
# and wait for SSH. It does not fetch or mutate images — see fetch-image and prepare-image.
- name: Check if GPU image cache exists
  ansible.builtin.stat:
    path: "{{ gpu_img_path }}"
  register: gpu_img_stat

- name: Determine best starting image
  ansible.builtin.set_fact:
    start_img_path: >-
      {{ gpu_img_path if (gpu_img_stat.stat.exists and no_cache != 'true')
         else prepared_start_img_path | default(base_img_path) }}

- name: Log starting image selection
  ansible.builtin.debug:
    msg: >-
      Starting build from: {{ start_img_path | basename }}
      (gpu_cached={{ gpu_img_stat.stat.exists }}, no_cache={{ no_cache }})

- name: Check if build image exists
  ansible.builtin.stat:
    path: "{{ build_img_path }}"
  register: build_image

- name: Create cloud-init user-data with SSH key
  ansible.builtin.copy:
    content: |
      #cloud-config
      hostname: build-node
      timezone: UTC
      users:
        - name: root
          ssh-authorized-keys:
            - "{{ lookup('file', ssh_public_key_path | expanduser)  }}"
    dest: "{{ user_data_file }}"
    mode: '0644'

- name: Check if KVM is available
  ansible.builtin.command: kvm-ok
  register: kvm_check
  changed_when: false
  failed_when: false

- name: Set virt_type based on KVM availability
  ansible.builtin.set_fact:
    virt_type: "{{ 'kvm' if kvm_check.rc == 0 else 'qemu' }}"

- name: Check if VM exists
  ansible.builtin.shell: virsh list --all | grep -q "{{ vm_name }}"
  register: vm_exists
  changed_when: false
  failed_when: false

- name: Debug
  ansible.builtin.debug:
    msg: "{{ vm_exists }}"

- name: Destroy existing VM
  ansible.builtin.command: virsh destroy "{{ vm_name }}"
  when: vm_exists.rc == 0 and (no_cache == 'true' or vm_exists.stdout != '')
  changed_when: false
  failed_when: false

- name: Undefine existing VM
  ansible.builtin.command: virsh undefine "{{ vm_name }}"
  when: vm_exists.rc == 0 and (no_cache == 'true' or vm_exists.stdout != '')
  changed_when: false
  failed_when: false

# Read the QEMU user/group that libvirt will use for dynamic ownership so we can
# pre-set the disk ownership before virt-install. Without this, libvirt registers
# the disk's current owner (root:root) at domain-define time, then fails at
# domain-start time when it tries to relabel to the QEMU user — "already in use".
# Ubuntu 26.04 (libvirt 12) ships qemu.conf with user/group COMMENTED OUT, so regex_search
# returns None and `| first` raises "'NoneType' object is not iterable". Commented out means
# libvirt uses its built-in defaults, which on Debian/Ubuntu are exactly these two values --
# so defaulting here reproduces what libvirt actually does rather than guessing.
- name: Set qemu user and group
  ansible.builtin.set_fact:
    qemu_user: "{{ (lookup('file', '/etc/libvirt/qemu.conf') | regex_search('(?m)^user = \"(.*)\"', '\\1') | default(['libvirt-qemu'], true)) | first }}"
    qemu_group: "{{ (lookup('file', '/etc/libvirt/qemu.conf') | regex_search('(?m)^group = \"(.*)\"', '\\1') | default(['kvm'], true)) | first }}"

- name: Ensure libvirt image directory exists
  ansible.builtin.file:
    path: "{{ libvirt_image_dir }}"
    state: directory
    mode: "0755"

- name: Copy QCOW2 image into libvirt storage
  ansible.builtin.copy:
    src: "{{ start_img_path }}"
    dest: "{{ build_img_path }}"
    mode: "0644"
    remote_src: yes
  when: (not build_image.stat.exists) or (no_cache == 'true')

- name: Set build disk ownership for libvirt DAC security driver
  ansible.builtin.file:
    path: "{{ build_img_path }}"
    owner: "{{ qemu_user }}"
    group: "{{ qemu_group }}"

- name: Fix permissions on libvirt cloud-init ISO directory
  ansible.builtin.file:
    path: /var/lib/libvirt/boot
    mode: "0755"

- name: Fix permissions on libvirt dir
  ansible.builtin.file:
    path: /var/lib/libvirt
    mode: "0755"

- name: Create cloud-init ISO manually
  ansible.builtin.command:
    cmd: cloud-localds /var/lib/libvirt/boot/tdx-cloudinit.iso "{{ user_data_file }}"
  args:
    creates: /var/lib/libvirt/boot/tdx-cloudinit.iso
  when: (not build_image.stat.exists) or (no_cache == 'true')

- name: Set cloud-init ISO permissions
  ansible.builtin.file:
    path: /var/lib/libvirt/boot/tdx-cloudinit.iso
    mode: "0644"

- name: Start temporary VM
  ansible.builtin.command: |
    virt-install \
      --name "{{ vm_name }}" \
      --ram {{ build_vm_ram }} \
      --vcpus {{ build_vm_vcpus }} \
      --disk path="{{ build_img_path }}",format=qcow2 \
      --disk path=/var/lib/libvirt/boot/tdx-cloudinit.iso,device=cdrom \
      --os-variant detect=on,require=off \
      --virt-type "{{ virt_type }}" \
      --network network=default,mac={{ build_vm_mac }} \
      --graphics vnc,listen=0.0.0.0,port="{{ vnc_port }}" \
      --import \
      --noautoconsole
  register: virt_install_result
  when: vm_exists.rc != 0 or no_cache == 'true'
  changed_when: virt_install_result.rc == 0
  failed_when: virt_install_result.rc != 0

- name: Check if VM is running
  ansible.builtin.shell: virsh list --state-running | grep -q "{{ vm_name }}"
  register: vm_running
  changed_when: false
  failed_when: false
  when: vm_exists.rc == 0 or no_cache == 'true'  # Only check if VM exists

- name: Start existing VM if not running
  ansible.builtin.command: virsh start "{{ vm_name }}"
  when: vm_exists.rc == 0 and vm_running.rc != 0 and no_cache == 'false'  # Run if VM exists but isn't running
  register: virt_start_result
  changed_when: virt_start_result.rc == 0
  failed_when: virt_start_result.rc != 0

- name: Wait for VM to be running
  ansible.builtin.shell: virsh list --state-running | grep -q "{{ vm_name }}"
  register: vm_running
  retries: 60
  delay: 10
  until: vm_running.rc == 0
  failed_when: vm_running.rc != 0
  changed_when: false

- name: Wait for SSH to be available on static IP
  ansible.builtin.wait_for:
    host: "{{ build_vm_ip }}"
    port: 22
    state: started
    timeout: 600
  delegate_to: localhost

- name: Update VM host with static IP
  ansible.builtin.add_host:
    name: build-node
    ansible_host: "{{ build_vm_ip }}"
    ansible_user: root
    ansible_ssh_private_key_file: "{{ ssh_private_key_path | expanduser }}"
    groups: vm
