---
# On Ubuntu 25.10+ with modular libvirt the QEMU domain driver is virtqemud,
# not the legacy monolithic libvirtd. Restart whichever is active.
- name: restart libvirtd
  block:
    - name: Restart virtqemud if present (modular libvirt)
      ansible.builtin.systemd:
        name: virtqemud
        state: restarted
      failed_when: false
      register: virtqemud_restart

    - name: Restart libvirtd (monolithic fallback)
      ansible.builtin.systemd:
        name: libvirtd
        state: restarted
      when: virtqemud_restart is failed or virtqemud_restart.status is not defined
      failed_when: false
