---
# compute-rtmr1-2 — Compute expected RTMR1/RTMR2 (direct boot) from the finalized qcow2.
#
# Runs on the host POST-luks (in the compute-measurements play), because luks rebuilds the
# initrd for both prod and debug — RTMR2 measures that final initrd. RTMR1/RTMR2 are
# version-level (topology-independent) and pinned here at build time rather than
# captured from a boot. Computed for BOTH prod and debug builds: the debug image has
# a distinct initrd (fail-open RC scripts) and thus a distinct measurement, which is
# registered rc:true API-side so the debug VM attests with it plus the operator RSA
# signature. Each build pins its own image's values. See compute-rtmr1-2.sh.
#
# Reads the direct-boot artifacts staged by stage-boot-artifacts (which runs first in
# the gather phase), so it needs no guestfish itself.
#
# Output: <final_img_path without extension>.rtmr1 and .rtmr2  (bare uppercase hex)
#
# Prerequisite on the build host: the tdx-measure fork binary (virtee/tdx-measure).
# Point tdx_measure_bin at it if not on PATH.

- name: Compute RTMR1/RTMR2 from final image (direct boot)
  ansible.builtin.command: >-
    {{ role_path }}/files/compute-rtmr1-2.sh {{ final_img_path }}
  environment:
    TDX_MEASURE_BIN: "{{ tdx_measure_bin | default('tdx-measure') }}"
  register: rtmr1_2_compute
  changed_when: false

- name: Register RTMR1/RTMR2 as build facts (no on-disk artifact)
  ansible.builtin.set_fact:
    rtmr1: "{{ rtmr1_2_compute.stdout | regex_search('RTMR1=([0-9A-Fa-f]+)', '\\1') | first }}"
    rtmr2: "{{ rtmr1_2_compute.stdout | regex_search('RTMR2=([0-9A-Fa-f]+)', '\\1') | first }}"

- name: Show RTMR1/RTMR2
  ansible.builtin.debug:
    msg: "RTMR1={{ rtmr1 }}  RTMR2={{ rtmr2 }}"
