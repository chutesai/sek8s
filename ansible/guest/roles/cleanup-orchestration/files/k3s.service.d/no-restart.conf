[Service]
# Do not automatically restart k3s on crash or exit.  A k3s failure must
# result in a full VM reboot so the complete security chain re-runs:
# initramfs unlock → rtmr3-measure → setup_storage (new LUKS keys + k3s
# encryption key) → rtmr3-verify → kubeconfig purge.  An in-place restart
# would skip all of these, recreate k3s.yaml with admin credentials, and
# leave the k3s encryption key in tmpfs from the original boot.
Restart=no
