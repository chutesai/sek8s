# Debug builds: copy the build-time encryption key to the ephemeral path that
# k3s-config-init.sh checks.  In production this file is written by initramfs
# via TDX attestation; this drop-in provides the same file for debug VMs so
# both environments run identical k3s configuration code paths.
[Service]
ExecStartPre=/bin/sh -c 'mkdir -p /run/chutes && cp /etc/chutes/k3s-encryption-config.yaml /run/chutes/k3s-encryption-config.yaml'
