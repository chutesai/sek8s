[Unit]
Requires=k3s-pre-start.service admission-controller.service setup-cache.service
After=k3s-pre-start.service admission-controller.service setup-cache.service
Wants=k3s-post-start.service

[Service]
# Check that config exists (it should after k3s-pre-start runs)
# This will fail if k3s-pre-start failed to create the config
ExecStartPre=/bin/bash -c 'test -f /etc/rancher/k3s/config.yaml || (echo "ERROR: k3s config not found" && exit 1)'