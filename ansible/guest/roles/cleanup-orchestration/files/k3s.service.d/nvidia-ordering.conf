[Unit]
# Ensure k3s starts after the NVIDIA GPU stack and stops before it during shutdown.
# On startup: k3s waits for Fabric Manager to initialize the NVSwitch/NVLink fabric
# before scheduling GPU pods (device plugin, DCGM, workloads).
# On shutdown: k3s (and all GPU pods) stops first, then FM cleanly drains the
# NVLink fabric and sends SOE shutdown commands without competing traffic.
# After= without Requires= is intentional: on non-NVSwitch systems where FM is
# masked, k3s proceeds immediately with no hard dependency.
After=nvidia-fabricmanager.service nvidia-persistenced.service
