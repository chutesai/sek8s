[Unit]
# system-manager runs confined by sek8s.system-manager, so it must not start unless the
# profiles actually loaded. Requires= also keeps the verifier reachable through a measured
# drop-in rather than only its unmeasured multi-user.target.wants symlink.
#
# Enforcing builds only: debug builds run the profiles in complain mode, and the verifier
# powers the VM off when a profile is not enforcing. Requires= starts a unit regardless of
# whether it is enabled, so gating this file is what keeps it out of a debug boot.
Requires=verify-apparmor-profiles.service
After=verify-apparmor-profiles.service
