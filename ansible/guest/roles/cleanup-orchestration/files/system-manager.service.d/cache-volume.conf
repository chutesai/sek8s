[Service]
# Cache volume (/var/snap/cache) is only available at runtime, not during build.
# Grant write access and ensure the XDG cache directory exists for hf-xet.
ReadWritePaths=/var/snap/cache
# '+' prefix: run outside the security sandbox so chown works (needs CAP_CHOWN).
ExecStartPre=+/bin/bash -c 'install -d -m 2775 -o system-manager -g tdx /var/snap/cache/.xdg-cache'
