---
# stage-boot-artifacts — Extract the direct-boot kernel/initrd/cmdline from the
# finalized image (pre-encryption) and persist them next to it as publishable
# artifacts (<image>.vmlinuz/.initrd/.cmdline). Published to R2 with the qcow2;
# read by both compute-rtmr1-2 (build) and the launcher (deploy). See
# files/stage-boot-artifacts.sh.
#
# Prerequisite on the build host: libguestfs-tools (guestfish).

- name: Check guestfish is available
  ansible.builtin.command: which guestfish
  changed_when: false
  register: stage_boot_guestfish_check
  failed_when: stage_boot_guestfish_check.rc != 0

- name: Stage direct-boot artifacts from final image
  ansible.builtin.command: >-
    {{ role_path }}/files/stage-boot-artifacts.sh {{ final_img_path }}
  register: stage_boot_result
  changed_when: true

- name: Show staged artifacts
  ansible.builtin.debug:
    msg: "{{ stage_boot_result.stderr_lines }}"
