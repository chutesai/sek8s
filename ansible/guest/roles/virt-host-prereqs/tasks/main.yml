---
# Host-side virtualisation prerequisites for driving a build VM: packages, libvirt
# dynamic ownership, the default network and the build VM's DHCP reservation.
#
# Split out of run-vm, which had grown to mean four things at once. This part is host
# provisioning, not VM lifecycle — build-setup.yml installs most of these packages already,
# so this is the idempotent belt for a host that was provisioned before they were added.
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - git
      - libguestfs-tools
      - virtinst
      - genisoimage
      - libvirt-daemon-system
      - qemu-utils
      - cryptsetup
      - cloud-image-utils
      # fetch-image pulls the multi-GB base image in parallel; a single HTTP stream caps at
      # around 30 MB/s to the CDN regardless of available bandwidth.
      - aria2
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Configure libvirt to enable dynamic ownership
  ansible.builtin.lineinfile:
    path: /etc/libvirt/qemu.conf
    regexp: '^#?dynamic_ownership\s*='
    line: 'dynamic_ownership = 1'
    backup: yes
  notify: restart libvirtd

- name: Apply libvirt config before any disk operations
  ansible.builtin.meta: flush_handlers

- name: Ensure libvirt default network is active
  ansible.builtin.command: virsh net-start default
  changed_when: false
  failed_when: false

- name: Set libvirt default network to autostart
  ansible.builtin.command: virsh net-autostart default
  changed_when: false
  failed_when: false

- name: Remove any existing DHCP reservations for build VM
  ansible.builtin.shell: |
    virsh net-dumpxml default | grep -q "{{ build_vm_mac }}" && \
    virsh net-update default delete ip-dhcp-host \
      "<host mac='{{ build_vm_mac }}'/>" --live --config || true
  changed_when: false
  failed_when: false

- name: Create static DHCP reservation for build VM
  ansible.builtin.command: |
    virsh net-update default add-last ip-dhcp-host \
      "<host mac='{{ build_vm_mac }}' name='build-node' ip='{{ build_vm_ip }}'/>" \
      --live --config
  register: reservation_result
  failed_when: false
  changed_when: "'Updated' in reservation_result.stdout or reservation_result.rc == 0"
