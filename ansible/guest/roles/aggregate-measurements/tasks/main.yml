---
# aggregate-measurements — Combine the per-register measurement facts into a single
# teeMeasurements-shaped YAML: the ONLY measurement artifact that persists on disk.
#
# All the raw values are in-play facts (no scattered .rtmrN / rtmr0.json files):
#   - rtmr1 / rtmr2        (compute-rtmr1-2, version-level)
#   - rtmr3               (compute-rtmr3, version-level, -> runtime_rtmr3)
#   - rtmr0_data          (compute-rtmr0: {version, mrtd, hardware:[…], pending_profiles?})
#
# RTMR0 generation is best-effort (needs a captured baseline CCEL); when rtmr0_data
# is absent we still emit the version-level registers with an empty hardware list.
#
# Output: measurements/<version>/measurements.yaml — one `measurements` list entry,
# ready to merge into chutes-ops values.yaml teeMeasurements.measurements.

- name: Warn when measurement facts are missing (partial tag run)
  # The compute roles set their facts via set_fact, which lives only for the run
  # that produced it. Re-running a subset of tags (e.g. just compute-measurements)
  # leaves the facts from the skipped plays unset — surface exactly which, and the
  # tags to re-run, instead of silently writing empty fields.
  ansible.builtin.debug:
    msg: >-
      WARNING: measurement fact(s) not set — likely a partial tag run. Missing:
      {{ _missing | join(', ') }}. The written YAML will have empty value(s) for
      these. Re-run '--tags compute-measurements' — it now spans every play that
      sets them (compute-rtmr3 + gather-measurement-inputs + compute-measurements).
  vars:
    _missing: >-
      {{ (['rtmr1'] if rtmr1 is not defined else [])
       + (['rtmr2'] if rtmr2 is not defined else [])
       + (['rtmr3'] if rtmr3 is not defined else [])
       + (['rtmr0_data'] if rtmr0_data is not defined else []) }}
  when: _missing | length > 0

- name: Assemble the teeMeasurements entry
  ansible.builtin.set_fact:
    _measurements_block:
      measurements:
        - version: "{{ vm_version }}"
          mrtd: "{{ (rtmr0_data | default({})).mrtd | default('') }}"
          rtmr1: "{{ rtmr1 | default('') }}"
          rtmr2: "{{ rtmr2 | default('') }}"
          runtime_rtmr3: "{{ rtmr3 | default('') }}"
          hardware: "{{ (rtmr0_data | default({})).hardware | default([]) }}"

- name: Ensure the measurements output directory exists
  ansible.builtin.file:
    path: "{{ repo_root }}/measurements/{{ vm_version }}"
    state: directory
    mode: '0755'

- name: Write aggregated measurements YAML (the only persisted artifact)
  # sort_keys=False preserves the insertion order of _measurements_block and each
  # hardware dict (version → mrtd → rtmr1/2 → runtime_rtmr3 → hardware; and name →
  # description → rtmr0 → expected_gpus → gpu_count) — matching the layout of the
  # chutes-ops values.yaml teeMeasurements it merges into. to_nice_yaml alphabetizes
  # by default, which buried `version` under `hardware`.
  ansible.builtin.copy:
    content: "{{ _measurements_block | to_nice_yaml(indent=2, sort_keys=False) }}"
    dest: "{{ repo_root }}/measurements/{{ vm_version }}/measurements.yaml"
    mode: '0644'

- name: Show aggregated measurements summary
  ansible.builtin.debug:
    msg: >-
      Wrote measurements/{{ vm_version }}/measurements.yaml —
      {{ ((rtmr0_data | default({})).hardware | default([])) | length }} hardware
      entr{{ 'y' if (((rtmr0_data | default({})).hardware | default([])) | length) == 1 else 'ies' }}{{
      ', pending: ' + ((rtmr0_data | default({})).pending_profiles | join(', '))
      if ((rtmr0_data | default({})).pending_profiles | default([])) else '' }}
