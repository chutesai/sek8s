---
- name: Install system dependencies for Python and Git
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - git
      - build-essential
      - curl
    state: present
    update_cache: yes

- name: Create temporary build directory
  ansible.builtin.tempfile:
    state: directory
    suffix: sek8s
  register: build_dir

- name: Copy root build artifacts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../{{ item }}"
    dest: "{{ build_dir.path }}"
  loop:
    - pyproject.toml
    - poetry.lock
    - README.md

- name: Create src directory in build dir
  ansible.builtin.file:
    path: "{{ build_dir.path }}/src"
    state: directory

- name: Copy sek8s source packages to temp directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../src/{{ item }}"
    dest: "{{ build_dir.path }}/src/"
  loop:
    - sek8s
    - sek8s-common

- name: Create application directory
  ansible.builtin.file:
    path: /opt/sek8s
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create application src directory
  ansible.builtin.file:
    path: /opt/sek8s/src
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy Python package files
  ansible.builtin.copy:
    src: "{{ build_dir.path }}/{{ item }}"
    dest: /opt/sek8s/{{ item }}
    remote_src: yes
    owner: root
    group: root
    mode: preserve
  loop:
    - src/sek8s/
    - src/sek8s-common/
    - pyproject.toml
  ignore_errors: yes

- name: Fix directory permissions
  ansible.builtin.shell: |
    find /opt/sek8s -type d -exec chmod 755 {} \;
    find /opt/sek8s -type f -name "*.py" -exec chmod 644 {} \;
  changed_when: false

- name: Copy README if exists (for metadata)
  ansible.builtin.copy:
    src: "{{ build_dir.path }}/README.md"
    dest: /opt/sek8s/README.md
    remote_src: yes
    owner: root
    group: root
    mode: '0644'
  ignore_errors: yes

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv /opt/sek8s/venv
    creates: /opt/sek8s/venv

# /opt/sek8s/venv is measured into RTMR3, so every input is pinned; `state: latest` made the
# measurement a function of the build date. setuptools and wheel come from
# guest-requirements.txt (locked main-group packages). poetry-core must match the pin in the
# packages' [build-system] requires — it builds the editable installs below and stamps its
# version into each dist-info/WHEEL; test_poetry_core_pins_are_aligned asserts they agree.
- name: Install pinned build tooling into the virtual environment
  ansible.builtin.pip:
    name:
      - pip==24.0
      - poetry-core==2.4.1
    virtualenv: /opt/sek8s/venv
    extra_args: "--no-compile"

- name: Stage the hash-pinned guest requirements
  ansible.builtin.copy:
    src: guest-requirements.txt
    dest: /opt/sek8s/guest-requirements.txt
    owner: root
    group: root
    mode: '0644'

# --require-hashes: a substituted artifact fails the build instead of silently changing RTMR3.
# --no-compile: bytecode is written in one deterministic pass at the end of this file.
- name: Install guest dependencies (exact versions, hash-checked)
  ansible.builtin.pip:
    requirements: /opt/sek8s/guest-requirements.txt
    virtualenv: /opt/sek8s/venv
    extra_args: "--no-compile --require-hashes"

# Editable installs cannot be hash-checked, so they run separately with --no-deps; everything
# they need is already installed above. --no-build-isolation uses the poetry-core pinned above
# instead of downloading an unpinned copy at build time.
- name: Install sek8s packages (editable, no deps)
  ansible.builtin.pip:
    name: "{{ item }}"
    virtualenv: /opt/sek8s/venv
    state: present
    extra_args: "-e --no-deps --no-build-isolation --no-compile"
  loop:
    - /opt/sek8s/src/sek8s-common/
    - /opt/sek8s/src/sek8s/

# Default (timestamp) invalidation embeds each source mtime in the .pyc header, so identical
# sources produce different bytes and RTMR3 moves. unchecked-hash writes no mtime, and means
# Python never revalidates against the .py — so nothing rewrites these at runtime either.
# /opt/sek8s/src is deliberately not compiled; it is measured as the repo ships it.
- name: Byte-compile the virtual environment deterministically
  ansible.builtin.command:
    cmd: >-
      /opt/sek8s/venv/bin/python -m compileall -q -f
      --invalidation-mode unchecked-hash /opt/sek8s/venv
  changed_when: true

- name: Clean up temporary build directory
  ansible.builtin.file:
    path: "{{ build_dir.path }}"
    state: absent

- name: Create sek8s group with specific GID
  group:
    name: sek8s
    state: present
    system: yes

- name: Set ownership and permissions for entire application directory
  ansible.builtin.file:
    path: /opt/sek8s
    state: directory
    owner: root
    group: sek8s
    mode: '0755'
    recurse: yes
