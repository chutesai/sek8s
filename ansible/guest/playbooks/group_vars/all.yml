---
# Common variables for all hosts

# Checkout root. In `all` (not `host`) scope so roles running in the `vm` plays resolve
# control-host paths too — they read files from this checkout via `copy: src=`.
repo_root: "{{ playbook_dir }}/../../.."

# Build control
no_cache: "{{ lookup('env', 'NO_CACHE') | default('false', true) | lower }}"

# System configuration
ansible_port: 22
ansible_ssh_common_args: -o StrictHostKeyChecking=no
timezone: UTC
swap_disable: true

# Networking configuration (used by all)
k3s_api_port: "6443"
cluster_cidr: 10.42.0.0/16
service_cidr: 10.43.0.0/16

# K3s Configuration
k3s_version: v1.35.4+k3s1

# Ubuntu major/minor version.
ubuntu_major: "24"
ubuntu_minor: "04"
# CUDA version - leave as-is unless skipping CUDA entirely (skip_cuda: true) for providers with pre-installed drivers
cuda_version: "13-2"
# NVIDIA driver branch
nvidia_version: "595"
# Package version pin — 595 uses unversioned package names from the CUDA repo only
# (nvidia-dkms-open, libnvidia-compute, nvidia-firmware, etc.); all driver/lib
# packages are pinned to this single version string.
# Reverted from 610.43.02: 610 fails NVLink fabric registration under TNVL on HGX
# H200 PPCIe (only 1/8 GPUs reach Fabric=Completed -> CUDA 802). Back to 595.71.05,
# the driver the last *stable* release also shipped. The crash-after-hours on the
# most recent 595.71.05 build is NOT a driver-version regression (the prior release
# ran the same 595.71.05 fine) — it is being chased as an upstream package drift:
# same version string, changed bytes / drifted unpinned dep from the CUDA repo.
nvidia_pkg_version: "595.71.05-1ubuntu1"
# 595 requires DKMS for kernel modules (no prebuilt linux-modules-nvidia-*-open).
# linux-headers and dkms are installed automatically by the gpu role.
# NVLSM (InfiniBand subnet manager) version pin from the CUDA repo. Pinned because
# NVIDIA's "latest" entry can transiently 404 — its Packages index lists a version
# before the matching .deb is uploaded. Bump to the newest version whose .deb resolves.
nvlsm_version: "2025.10.12-1"
# Flag to skip the cuda install entirely, if the provider already has cuda 12.x+ installed (note some chutes will not work unless 12.6+)
skip_cuda: false
# Flag to enable/disable IPv6. Some hosts may require IPv6 to be on.
ipv6_enabled: true

# Module Security Configuration
enable_module_security: true

# Attestation settings

# Module monitoring
alert_on_unsigned_modules: true
alert_on_tainted_kernel: true

# Critical modules that must always be present
critical_kernel_modules:
  - overlay
  - br_netfilter
  - nf_conntrack
  - iptable_nat
  - iptable_filter
  - ip_tables

# ── Base image ───────────────────────────────────────────────────────────────
# In `all` scope, not `host`: the vm plays need these too (base-image.yml stamps the version and
# ubuntu_version into the image), and group_vars/host.yml does not apply to the vm group.
ubuntu_version: "24.04"

# The pin of the PUBLISHED base image the guest build consumes. Two plain files matching the
# VERSION convention: the version selects the artifact, the sha256 validates it. The hash must
# live in the repo — fetching it from R2 alongside the image would mean trusting R2 to say what
# the image should hash to, which defeats the pin. CI enforces that both move together.
base_image_version: "{{ lookup('file', playbook_dir + '/../BASE_IMAGE_VERSION') | trim }}"
base_image_sha256: "{{ lookup('file', playbook_dir + '/../BASE_IMAGE_SHA256') | trim }}"

# What base-image.yml builds FROM. Defaults rather than -e arguments so the repo records which
# upstream image each published base image came from, and `git log` on this file is the history
# of that. MUST be a DATED respin: releases/24.04/release/ is rolling and Canonical repoints it
# (observed moving within a day), which is what made the guest build unreproducible.
# Hash comes from that respin's own SHA256SUMS, never the rolling one.
canonical_image_url: "https://cloud-images.ubuntu.com/releases/24.04/release-20260911/ubuntu-24.04-server-cloudimg-amd64.img"
canonical_image_sha256: "612b2c0cc1bc413a6cb8c38fd611794caf0f2b436c50013d8b3794db12ad7354"

# Point-in-time Ubuntu archive for the base image build. Pinned here rather than passed on the
# command line so the repo records which archive state each published base image came from —
# together with canonical_image_* above, that is what makes the layer rebuildable by a third
# party rather than merely verifiable by inspection. Matches the dated respin above so both
# halves of the image come from the same moment.
# Empty = live mirror; package versions then float and the layer is not rebuildable.
apt_snapshot: "20260911T000000Z"
apt_snapshot_base_url: "https://snapshot.ubuntu.com/ubuntu"
