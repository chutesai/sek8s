---
- name: Confirm guest image build configuration
  hosts: host
  become: false
  tags:
    - always
  tasks:
    - name: Output build configuration
      ansible.builtin.debug:
        msg:
          - "Build env: {{ build_env }}"
          - "VM version: {{ vm_version }}"
          - "Debug build: {{ debug_build | default(false) }}"
          - "Benchmark build: {{ benchmark_build | default(false) }}"
          - "Final image: {{ final_img_path }}"

    - name: Validate benchmark_ssh_keys is non-empty when benchmark_build is true
      ansible.builtin.fail:
        msg: "benchmark_ssh_keys must be a non-empty list when benchmark_build: true — add partner public key(s) to inventory.yml"
      when:
        - benchmark_build | default(false)
        - benchmark_ssh_keys | default([]) | length == 0

    - name: Confirm intended build before starting VM
      ansible.builtin.pause:
        prompt: >-
          Is this the intended build? The next step launches the TDX guest VM toward this output path.
          Press Enter to continue, or Ctrl+C to abort.

- name: Run TDX guest image
  hosts: host
  become: true
  tags:
    - run-vm
    - always
  handlers:
    - name: Global handlers
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../handlers/main.yml"
  tasks:
    - name: Include run TDX vm role
      ansible.builtin.include_role:
        name: run-vm

- name: Common Setup
  hosts: vm
  become: true
  tags:
    - common
  handlers:
    - name: Global handlers
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../handlers/main.yml"
  tasks:
    - name: Include common role
      ansible.builtin.include_role:
        name: common

- name: Setup K3S clusters
  hosts: vm
  become: true
