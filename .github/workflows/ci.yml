name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run linters
        run: make lint-local

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      # Without this, the five profile-parse cases in test_apparmor_profiles.py
      # pytest.skip silently, so a profile that fails to compile ships green. A profile
      # that will not load is boot-fatal: verify-apparmor-profiles.service powers the
      # guest off when a sek8s profile is missing from the loaded set.
      # apparmor-utils: without apparmor_parser the profile compile checks skip silently,
      #   so a profile that will not load ships green -- and that is boot-fatal.
      # en_US.UTF-8: the RTMR3 collation test must run under a locale whose sort order
      #   differs from C, or it cannot detect the LC_ALL=C pin being dropped. Runners
      #   default to C.UTF-8, which collates in byte order and proves nothing.
      - name: Install test prerequisites (AppArmor parser, non-C locale)
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor-utils locales
          sudo locale-gen en_US.UTF-8

      - name: Run unit tests
        run: make test-local

  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require fragment (non-main targets)
        if: github.base_ref != 'main'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | python scripts/promote_changelogs.py --check-branch "${{ github.head_ref }}"

      - name: Require no pending fragments (main target)
        if: github.base_ref == 'main'
        run: python scripts/promote_changelogs.py --check --strict

  opa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OPA
        run: make install-opa

      - name: Run OPA policy tests
        run: make test-opa-policies
