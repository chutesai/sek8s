name: Version Tag

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base for PR diff
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.event.pull_request.base.sha }}

      - name: Verify VERSION
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          changed_files=$(git diff --name-only "$base" "$head" 2>/dev/null || true)
          if [ -z "$changed_files" ]; then
            echo "No file changes in range; skipping VERSION check."
            exit 0
          fi

          # Paths that imply a user-visible / artifact release (guest image stack or sek8s packages).
          # Extend this list if new top-level components should force a VERSION bump.
          needs_version=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              ansible/*|sek8s/*|nvevidence/*)
                needs_version=true
                break
                ;;
              pyproject.toml|poetry.lock)
                needs_version=true
                break
                ;;
            esac
          done <<< "$changed_files"

          if [ "$needs_version" != true ]; then
            echo "No changes under ansible/, sek8s/, nvevidence/, pyproject.toml, or poetry.lock."
            echo "VERSION bump not required for this merge."
            exit 0
          fi

          if ! echo "$changed_files" | grep -qx "VERSION"; then
            echo "::error::This PR changes the guest image stack and/or sek8s packages but VERSION was not updated. Bump VERSION before merging."
            exit 1
          fi
          echo "VERSION was updated together with release-scoped paths."

  tag-version:
    needs: version-check
    if: github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if VERSION changed on this push
        id: version_changed
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          changed_files=$(git diff --name-only "$base" "$head" 2>/dev/null || true)
          if echo "$changed_files" | grep -qx "VERSION"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "VERSION is in this push; will create tag if new."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "VERSION unchanged on this push; skipping tag."
          fi

      - name: Read version
        id: version
        if: steps.version_changed.outputs.changed == 'true'
        run: |
          version=$(cat VERSION | tr -d '\n' | tr -d ' ')
          if [ -z "$version" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check tag does not exist
        if: steps.version_changed.outputs.changed == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "::error::Tag $tag already exists. Bump the version in VERSION before merging."
            exit 1
          fi

      - name: Create and push tag
        if: steps.version_changed.outputs.changed == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
