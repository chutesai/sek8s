name: Version Tag

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base for PR diff
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.event.pull_request.base.sha }}

      - name: Verify VERSION bumps
        id: version_bumps
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          changed_files=$(git diff --name-only "$base" "$head" 2>/dev/null || true)
          if [ -z "$changed_files" ]; then
            echo "No file changes in range; skipping VERSION check."
            exit 0
          fi

          errors=0
          bumped_versions=""

          # --- VM image domain ---
          # ansible/*, src/sek8s/*, src/sek8s-common/*, nvevidence/*,
          # root pyproject.toml, poetry.lock  →  ansible/k3s/VERSION
          needs_vm_bump=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              ansible/*|src/sek8s/*|src/sek8s-common/*|nvevidence/*) needs_vm_bump=true; break ;;
              pyproject.toml|poetry.lock) needs_vm_bump=true; break ;;
            esac
          done <<< "$changed_files"

          if [ "$needs_vm_bump" = true ]; then
            if ! echo "$changed_files" | grep -qx "ansible/k3s/VERSION"; then
              echo "::error::Changes in the VM image domain (ansible/, src/sek8s/, src/sek8s-common/, nvevidence/, root pyproject/lock) require an ansible/k3s/VERSION bump."
              errors=$((errors + 1))
            else
              echo "VM domain: ansible/k3s/VERSION bumped."
              bumped_versions="$bumped_versions ansible/k3s/VERSION"
            fi
          else
            echo "No VM-domain changes detected."
          fi

          # --- Attestation-proxy domain ---
          # src/attestation-proxy/*  →  src/attestation-proxy/VERSION
          needs_proxy_bump=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/attestation-proxy/*) needs_proxy_bump=true; break ;;
            esac
          done <<< "$changed_files"

          if [ "$needs_proxy_bump" = true ]; then
            if ! echo "$changed_files" | grep -qx "src/attestation-proxy/VERSION"; then
              echo "::error::Changes under src/attestation-proxy/ require an src/attestation-proxy/VERSION bump."
              errors=$((errors + 1))
            else
              echo "Proxy domain: src/attestation-proxy/VERSION bumped."
              bumped_versions="$bumped_versions src/attestation-proxy/VERSION"
            fi
          else
            echo "No proxy-domain changes detected."
          fi

          # Collect any per-package VERSION bumps (sek8s, sek8s-common)
          for vf in src/sek8s/VERSION src/sek8s-common/VERSION; do
            if echo "$changed_files" | grep -qx "$vf"; then
              bumped_versions="$bumped_versions $vf"
            fi
          done

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi

          echo "bumped_versions=$bumped_versions" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: github.event_name == 'pull_request' && steps.version_bumps.outputs.bumped_versions != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify changelog fragments
        if: github.event_name == 'pull_request' && steps.version_bumps.outputs.bumped_versions != ''
        run: |
          python scripts/promote_changelogs.py --check \
            --version-files ${{ steps.version_bumps.outputs.bumped_versions }}

  pyproject-sync-check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify VERSION ↔ pyproject.toml sync
        run: python scripts/sync_pyproject_versions.py --check

  tag-version:
    needs: [version-check, pyproject-sync-check]
    if: github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed VERSION files
        id: detect
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          changed_files=$(git diff --name-only "$base" "$head" 2>/dev/null || true)

          bumped_versions=""
          check_version() {
            local file="$1" key="$2"
            if echo "$changed_files" | grep -qx "$file"; then
              echo "${key}=true" >> "$GITHUB_OUTPUT"
              echo "$file changed; will tag."
              bumped_versions="$bumped_versions $file"
            else
              echo "${key}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          check_version "ansible/k3s/VERSION"          "vm"
          check_version "src/sek8s/VERSION"             "sek8s"
          check_version "src/sek8s-common/VERSION"      "common"
          check_version "src/attestation-proxy/VERSION"  "proxy"

          echo "bumped_versions=$bumped_versions" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.detect.outputs.bumped_versions != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Promote changelogs
        if: steps.detect.outputs.bumped_versions != ''
        run: |
          python scripts/promote_changelogs.py --promote \
            --version-files ${{ steps.detect.outputs.bumped_versions }}

      - name: Commit changelog updates
        if: steps.detect.outputs.bumped_versions != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add changelogs/
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
          else
            git commit -m "chore: promote changelogs for release"
            git push
          fi

      - name: Create tags
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          create_tag() {
            local version_file="$1" prefix="$2"
            local version
            version=$(tr -d '[:space:]' < "$version_file")
            if [ -z "$version" ]; then
              echo "::error::$version_file is empty"
              exit 1
            fi
            local tag="${prefix}${version}"
            if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
              echo "::error::Tag $tag already exists. Bump the version in $version_file."
              exit 1
            fi
            git tag "$tag"
            git push origin "$tag"
            echo "Created tag $tag"
          }

          if [ "${{ steps.detect.outputs.vm }}" = "true" ]; then
            create_tag "ansible/k3s/VERSION" "v"
          fi
          if [ "${{ steps.detect.outputs.sek8s }}" = "true" ]; then
            create_tag "src/sek8s/VERSION" "sek8s-v"
          fi
          if [ "${{ steps.detect.outputs.common }}" = "true" ]; then
            create_tag "src/sek8s-common/VERSION" "sek8s-common-v"
          fi
          if [ "${{ steps.detect.outputs.proxy }}" = "true" ]; then
            create_tag "src/attestation-proxy/VERSION" "attestation-proxy-v"
          fi
