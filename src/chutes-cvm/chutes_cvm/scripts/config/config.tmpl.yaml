# tee-vm.yaml - TEE VM Configuration Template
# Copy this file and customize for your deployment

# VM Identity
vm:
  hostname: chutes-miner-tee-0 # Must be unique per miner hotkey
  base_image: ""  # Published image-set directory (qcow2 + boot artifacts + manifest.json). Empty = /var/lib/chutes/base-images/tdx-guest/ (populated by `quick-launch --download`).
  vm_image_directory: ""  # Directory for per-VM image files. Empty = /var/lib/chutes/vm-images/ (naming: tdx-<hostname>-<sha256>.qcow2)

# Miner Credentials (Optional - prefer passing via CLI for security)
miner:
  ss58: "your_ss58_credential_here"
  seed: "your_seed_credential_here"

# Docker Hub (optional) — raises authenticated pull limits for k3s/containerd and cosign.
# Prefer a read-only Personal Access Token: https://docs.docker.com/docker-hub/access-tokens/
# CLI flags --docker-hub-username / --docker-hub-token override this block when both are set.
# See config.prod.example.yaml / config.debug.example.yaml for commented examples.
# docker_hub:
#   username: "your_dockerhub_username"
#   token: "dckr_pat_..."

# Network Configuration
network:
  vm_ip: "192.168.100.2"
  bridge_ip: "192.168.100.1/24"
  dns: "8.8.8.8"
  # public_interface: auto-detected from default route when empty or omitted.
  # Set explicitly only on multi-homed hosts where the default-route NIC is not
  # the intended outbound interface for VM traffic (e.g. management vs data NIC).
  public_interface: ""
  type: "tap"  # Network type: "tap" (bridged) or "user" (SLIRP/port forwarding)
  ssh_port: 2222  # SSH port for user mode networking

# Volume Configuration
volumes:
  # General cache volume settings (required)
  cache:
    size: "5000G"
    path: ""  # Leave empty to auto-generate (cache-<hostname>.raw) or specify path (/data/cache-volume.raw)
  
  # Storage volume settings (required for VM storage - used for containerd and kubelet-pods)
  storage:
    size: "500G"
    path: ""  # Leave empty to auto-generate (storage-<hostname>.raw) or specify path (/data/storage.raw)
  
  # Config volume settings  
  config:
    path: ""  # Leave empty to auto-generate, or specify volume path (/data/config-volume.qcow2)


# Device Configuration
devices:
  bind_devices: true  # Set to false to skip GPU/NVSwitch binding

# Runtime Configuration
runtime:
  foreground: false  # Set to true for foreground mode