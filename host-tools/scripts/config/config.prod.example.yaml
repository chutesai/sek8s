# Production TEE VM Configuration
# Encrypted volumes, production image

vm:
  hostname: chutes-miner-prod-0
  base_image: "/var/lib/chutes/base-images/tdx-guest.qcow2"  # Or custom path; overlay created from this
  overlay_directory: ""  # Empty = /var/lib/chutes/vm-overlays/
  
miner:
  ss58: "5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY"
  seed: "your_production_seed_here"

# Optional Docker Hub credentials — higher pull limits for k3s/containerd and cosign (anonymous quota is tight).
# Use a read-only PAT: https://docs.docker.com/docker-hub/access-tokens/
# Values are written to the config volume as cleartext files; protect the volume.
# CLI wins when both are set: --docker-hub-username / --docker-hub-token
# docker_hub:
#   username: "your_dockerhub_username"
#   token: "dckr_pat_xxxxxxxx"

network:
  vm_ip: "192.168.100.2"
  bridge_ip: "192.168.100.1/24"
  dns: "8.8.8.8"
  public_interface: "ens9f0np0"
  type: "tap"
  ssh_port: 2222

volumes:
  cache:
    size: "5000G"
    path: ""  # Auto-generate: cache-chutes-miner-prod-0.raw
  
  storage:
    size: "500G"
    path: ""  # Auto-generate: storage-chutes-miner-prod-0.raw
  
  config:
    path: ""  # Auto-generate: config-chutes-miner-prod-0.qcow2

devices:
  bind_devices: true

runtime:
  foreground: false
  # Host CPU tuning is a separate, operator-driven step (decoupled from launch):
  #   sudo host-tools/scripts/tune-host.sh      # governor=performance, disable C1E/C6
  #   sudo host-tools/scripts/restore-host.sh   # revert
